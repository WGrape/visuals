<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高并发场景核心术语全解析</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --bg-card-hover: #222d3f;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-cyan: #39d2c0;
            --accent-pink: #f778ba;
            --accent-yellow: #e3b341;
            --glow-blue: rgba(88,166,255,0.15);
            --glow-red: rgba(248,81,73,0.15);
            --glow-green: rgba(63,185,80,0.15);
            --glow-orange: rgba(210,153,34,0.15);
            --glow-purple: rgba(188,140,255,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ========== 背景粒子 ========== */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 导航 ========== */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(13,17,23,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 1.5rem;
        }
        .nav-logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 0.3rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-link {
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            text-decoration: none;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
            background: rgba(88,166,255,0.1);
        }
        .nav-link.active { color: var(--accent-blue); }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 80px 1.5rem 4rem;
        }

        /* ========== Hero ========== */
        .hero {
            text-align: center;
            padding: 4rem 0 3rem;
        }
        .hero-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-cyan);
            background: rgba(57,210,192,0.1);
            border: 1px solid rgba(57,210,192,0.2);
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }
        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 680px;
            margin: 0 auto 2rem;
        }

        /* ========== 流量实时模拟 ========== */
        .traffic-simulator {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 0 auto 3rem;
            max-width: 900px;
            position: relative;
            overflow: hidden;
        }
        .traffic-simulator::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan), var(--accent-green));
        }
        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .sim-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }
        .sim-controls {
            display: flex;
            gap: 0.5rem;
        }
        .sim-btn {
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sim-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .sim-btn.active {
            background: rgba(88,166,255,0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        #traffic-chart {
            width: 100%;
            height: 180px;
            display: block;
        }
        .sim-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .sim-stat {
            text-align: center;
            padding: 0.6rem;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .sim-stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sim-stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 0.2rem;
        }
        .stat-green { color: var(--accent-green); }
        .stat-orange { color: var(--accent-orange); }
        .stat-red { color: var(--accent-red); }
        .stat-blue { color: var(--accent-blue); }

        /* ========== 分类区域 ========== */
        .section { margin-bottom: 4rem; scroll-margin-top: 70px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .section-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .section-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ========== 术语卡片 ========== */
        .terms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }
        .term-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.4rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .term-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px;
            height: 100%;
            border-radius: 3px 0 0 3px;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .term-card:hover {
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .term-card:hover::before { opacity: 1; }
        .term-card.danger { --card-accent: var(--accent-red); }
        .term-card.danger::before { background: var(--accent-red); }
        .term-card.danger:hover { border-color: rgba(248,81,73,0.3); box-shadow: 0 8px 30px var(--glow-red); }
        .term-card.warning { --card-accent: var(--accent-orange); }
        .term-card.warning::before { background: var(--accent-orange); }
        .term-card.warning:hover { border-color: rgba(210,153,34,0.3); box-shadow: 0 8px 30px var(--glow-orange); }
        .term-card.info { --card-accent: var(--accent-blue); }
        .term-card.info::before { background: var(--accent-blue); }
        .term-card.info:hover { border-color: rgba(88,166,255,0.3); box-shadow: 0 8px 30px var(--glow-blue); }
        .term-card.strategy { --card-accent: var(--accent-green); }
        .term-card.strategy::before { background: var(--accent-green); }
        .term-card.strategy:hover { border-color: rgba(63,185,80,0.3); box-shadow: 0 8px 30px var(--glow-green); }
        .term-card.purple { --card-accent: var(--accent-purple); }
        .term-card.purple::before { background: var(--accent-purple); }
        .term-card.purple:hover { border-color: rgba(188,140,255,0.3); box-shadow: 0 8px 30px var(--glow-purple); }

        .term-header {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .term-emoji {
            font-size: 1.6rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .term-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .term-alias {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }
        .term-brief {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }
        .term-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        .term-card.expanded .term-detail {
            max-height: 800px;
        }
        .term-detail-inner {
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }
        .term-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--card-accent, var(--accent-blue));
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.5rem;
        }
        .term-detail-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.7;
        }
        .term-example {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            line-height: 1.6;
            border-left: 2px solid var(--card-accent, var(--accent-blue));
        }
        .term-example .comment { color: var(--text-muted); }
        .term-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.8rem;
        }
        .term-tag {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(88,166,255,0.08);
            color: var(--accent-blue);
            border: 1px solid rgba(88,166,255,0.15);
        }
        .term-severity {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .severity-high { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
        .severity-mid { background: var(--accent-orange); box-shadow: 0 0 8px var(--accent-orange); }
        .severity-low { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .expand-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.5rem;
        }
        .term-card.expanded .expand-hint::after { content: '收起 ↑'; }
        .term-card:not(.expanded) .expand-hint::after { content: '点击展开详情 ↓'; }

        /* ========== 动画演示区 ========== */
        .anim-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .anim-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }
        .anim-canvas-wrap {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .anim-canvas-wrap canvas {
            width: 100%;
            height: 280px;
            display: block;
        }
        .anim-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .anim-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.8rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }

        /* ========== 全屏弹窗 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 2.5rem;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .modal-content .alias {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .modal-content p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.8;
        }
        .modal-content h3 {
            font-size: 1rem;
            color: var(--accent-blue);
            margin: 1.5rem 0 0.8rem;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 300;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.85rem;
            transform: translateY(120%);
            transition: transform 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translateY(0); }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .container { padding: 70px 1rem 2rem; }
            .sim-stats { grid-template-columns: repeat(2, 1fr); }
            .terms-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 1.5rem; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ========== 入场动画 ========== */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<!-- 导航 -->
<nav class="top-nav">
    <div class="nav-logo">⚡ 高并发术语词典</div>
    <div class="nav-links">
        <a class="nav-link active" href="#simulator">流量模拟</a>
        <a class="nav-link" href="#traffic-problems">流量问题</a>
        <a class="nav-link" href="#system-failures">系统故障</a>
        <a class="nav-link" href="#data-problems">数据问题</a>
        <a class="nav-link" href="#performance-metrics">性能指标</a>
        <a class="nav-link" href="#solutions">应对策略</a>
    </div>
</nav>

<div class="container">

    <!-- Hero -->
    <div class="hero">
        <div class="hero-badge">🗄️ High Concurrency Glossary</div>
        <h1>高并发场景核心术语全解析</h1>
        <p>从流量突刺到雪崩效应，从缓存击穿到惊群效应——一页搞懂高并发系统中的所有关键概念、成因与应对方案</p>
    </div>

    <!-- 流量模拟器 -->
    <div class="traffic-simulator fade-in" id="simulator">
        <div class="sim-header">
            <div class="sim-title">📊 实时流量模拟器</div>
            <div class="sim-controls">
                <button class="sim-btn active" onclick="setSimMode('normal')">平稳流量</button>
                <button class="sim-btn" onclick="setSimMode('spike')">流量突刺</button>
                <button class="sim-btn" onclick="setSimMode('avalanche')">雪崩扩散</button>
                <button class="sim-btn" onclick="setSimMode('thundering')">惊群效应</button>
            </div>
        </div>
        <canvas id="traffic-chart"></canvas>
        <div class="sim-stats">
            <div class="sim-stat">
                <div class="sim-stat-label">当前 QPS</div>
                <div class="sim-stat-value stat-blue" id="stat-qps">0</div>
            </div>
            <div class="sim-stat">
                <div class="sim-stat-label">响应时间</div>
                <div class="sim-stat-value stat-green" id="stat-rt">0ms</div>
            </div>
            <div class="sim-stat">
                <div class="sim-stat-label">错误率</div>
                <div class="sim-stat-value stat-red" id="stat-err">0%</div>
            </div>
            <div class="sim-stat">
                <div class="sim-stat-label">系统状态</div>
                <div class="sim-stat-value stat-green" id="stat-status">正常</div>
            </div>
        </div>
    </div>

    <!-- ====== 第一类：流量问题 ====== -->
    <div class="section fade-in" id="traffic-problems">
        <div class="section-header">
            <div class="section-icon" style="background:rgba(248,81,73,0.12);color:var(--accent-red);">🌊</div>
            <div>
                <div class="section-title">流量问题类</div>
                <div class="section-desc">与请求量、流量模式直接相关的术语</div>
            </div>
        </div>
        <div class="terms-grid" id="grid-traffic"></div>
    </div>

    <!-- ====== 第二类：系统故障 ====== -->
    <div class="section fade-in" id="system-failures">
        <div class="section-header">
            <div class="section-icon" style="background:rgba(210,153,34,0.12);color:var(--accent-orange);">💥</div>
            <div>
                <div class="section-title">系统故障类</div>
                <div class="section-desc">故障传播与系统级灾难效应</div>
            </div>
        </div>
        <div class="terms-grid" id="grid-failures"></div>
    </div>

    <!-- ====== 第三类：数据问题 ====== -->
    <div class="section fade-in" id="data-problems">
        <div class="section-header">
            <div class="section-icon" style="background:rgba(188,140,255,0.12);color:var(--accent-purple);">🗄️</div>
            <div>
                <div class="section-title">数据/缓存问题类</div>
                <div class="section-desc">与缓存、数据库读写直接相关的术语</div>
            </div>
        </div>
        <div class="terms-grid" id="grid-data"></div>
    </div>

    <!-- ====== 第四类：性能指标 ====== -->
    <div class="section fade-in" id="performance-metrics">
        <div class="section-header">
            <div class="section-icon" style="background:rgba(88,166,255,0.12);color:var(--accent-blue);">📈</div>
            <div>
                <div class="section-title">性能指标类</div>
                <div class="section-desc">衡量系统性能的核心量化指标</div>
            </div>
        </div>
        <div class="terms-grid" id="grid-metrics"></div>
    </div>

    <!-- ====== 第五类：应对策略 ====== -->
    <div class="section fade-in" id="solutions">
        <div class="section-header">
            <div class="section-icon" style="background:rgba(63,185,80,0.12);color:var(--accent-green);">🛡️</div>
            <div>
                <div class="section-title">应对策略类</div>
                <div class="section-desc">保护系统、应对高并发的核心手段</div>
            </div>
        </div>
        <div class="terms-grid" id="grid-solutions"></div>
    </div>

</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 术语数据 ====================
const termsData = {
    traffic: [
        {

// ==================== 流量模拟器 ====================
const simCanvas = document.getElementById('traffic-chart');
const simCtx = simCanvas.getContext('2d');
let simMode = 'normal';
let simData = [];
let simTime = 0;

function setSimMode(mode) {
    simMode = mode;
    document.querySelectorAll('.sim-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    simData = [];
    simTime = 0;
}

function resizeSimCanvas() {
    const rect = simCanvas.parentElement.getBoundingClientRect();
    simCanvas.width = rect.width - 48;
    simCanvas.height = 180;
}

function getTrafficPoint() {
    const t = simTime * 0.02;
    let qps, rt, err;

    switch(simMode) {
        case 'normal':
            qps = 1000 + Math.sin(t) * 200 + Math.random() * 100;
            rt = 15 + Math.random() * 5;
            err = 0.01 + Math.random() * 0.02;
            break;
        case 'spike':
            const spikePhase = (t % 10);
            if (spikePhase < 2) {
                qps = 1000 + spikePhase * 20000 + Math.random() * 500;
                rt = 15 + spikePhase * 1500 + Math.random() * 100;
                err = spikePhase * 15 + Math.random() * 2;
            } else {
                qps = 1000 + Math.max(0, (4 - spikePhase) * 5000) + Math.random() * 200;
                rt = 15 + Math.max(0, (4 - spikePhase) * 400) + Math.random() * 20;
                err = Math.max(0.01, (4 - spikePhase) * 5) + Math.random();
            }
            break;
        case 'avalanche':
            const avPhase = (t % 12);
            if (avPhase < 3) {
                qps = 1000 + Math.random() * 100;
                rt = 15 + avPhase * 200 + Math.random() * 10;
                err = avPhase * 2 + Math.random();
            } else if (avPhase < 6) {
                qps = Math.max(100, 1000 - (avPhase - 3) * 300) + Math.random() * 50;
                rt = 600 + (avPhase - 3) * 500 + Math.random() * 100;
                err = 6 + (avPhase - 3) * 15 + Math.random();
            } else {
                qps = 100 + Math.random() * 50;
                rt = 2100 + Math.random() * 500;
                err = 50 + Math.random() * 5;
            }
            break;
        case 'thundering':
            const thPhase = (t % 8);
            if (thPhase < 0.5) {
                qps = 1000 + thPhase * 38000 + Math.random() * 1000;
                rt = 15 + Math.random() * 5;
                err = 0.01 + Math.random() * 0.02;
            } else if (thPhase < 2) {
                qps = 20000 - (thPhase - 0.5) * 18000 + Math.random() * 2000;
                rt = 20 + (thPhase - 0.5) * 1000 + Math.random() * 50;
                err = (thPhase - 0.5) * 20 + Math.random();
            } else {
                qps = 1000 + Math.random() * 500;
                rt = 20 + Math.random() * 10;
                err = Math.max(0.5, 10 - (thPhase - 2) * 3) + Math.random();
            }
            break;
    }

    return { qps: Math.max(0, qps), rt: Math.max(0, rt), err: Math.max(0, Math.min(100, err)) };
}

function drawSim() {
    resizeSimCanvas();
    const w = simCanvas.width, h = simCanvas.height;
    const point = getTrafficPoint();

    simData.push(point);
    if (simData.length > w) simData.shift();

    simCtx.clearRect(0, 0, w, h);

    // 网格
    simCtx.strokeStyle = 'rgba(48,54,61,0.5)';
    simCtx.lineWidth = 0.5;
    for (let i = 0; i < 5; i++) {
        const y = (h / 5) * (i + 1);
        simCtx.beginPath();
        simCtx.moveTo(0, y);
        simCtx.lineTo(w, y);
        simCtx.stroke();
    }

    if (simData.length < 2) { simTime++; requestAnimationFrame(drawSim); return; }

    const maxQps = Math.max(5000, ...simData.map(d => d.qps)) * 1.1;

    // 渐变填充
    const grad = simCtx.createLinearGradient(0, 0, 0, h);
    const isAlert = point.qps > 5000 || point.rt > 500 || point.err > 5;
    if (isAlert) {
        grad.addColorStop(0, 'rgba(248,81,73,0.3)');
        grad.addColorStop(1, 'rgba(248,81,73,0.0)');
    } else if (point.qps > 2000) {
        grad.addColorStop(0, 'rgba(210,153,34,0.3)');
        grad.addColorStop(1, 'rgba(210,153,34,0.0)');
    } else {
        grad.addColorStop(0, 'rgba(88,166,255,0.25)');
        grad.addColorStop(1, 'rgba(88,166,255,0.0)');
    }

    simCtx.beginPath();
    simCtx.moveTo(0, h);
    for (let i = 0; i < simData.length; i++) {
        const x = (i / (w - 1)) * (w - 1);
        const y = h - (simData[i].qps / maxQps) * (h - 20);
        if (i === 0) simCtx.lineTo(x, y);
        else simCtx.lineTo(x, y);
    }
    simCtx.lineTo((simData.length - 1) / (w - 1) * (w - 1), h);
    simCtx.closePath();
    simCtx.fillStyle = grad;
    simCtx.fill();

    // 线条
    const lineColor = isAlert ? '#f85149' : point.qps > 2000 ? '#d29922' : '#58a6ff';
    simCtx.beginPath();
    simCtx.strokeStyle = lineColor;
    simCtx.lineWidth = 2;
    simCtx.lineJoin = 'round';
    for (let i = 0; i < simData.length; i++) {
        const x = (i / (w - 1)) * (w - 1);
        const y = h - (simData[i].qps / maxQps) * (h - 20);
        if (i === 0) simCtx.moveTo(x, y);
        else simCtx.lineTo(x, y);
    }
    simCtx.stroke();

    // 更新统计
    document.getElementById('stat-qps').textContent = Math.round(point.qps).toLocaleString();
    const rtEl = document.getElementById('stat-rt');
    rtEl.textContent = Math.round(point.rt) + 'ms';
    rtEl.className = 'sim-stat-value ' + (point.rt > 500 ? 'stat-red' : point.rt > 100 ? 'stat-orange' : 'stat-green');
    const errEl = document.getElementById('stat-err');
    errEl.textContent = point.err.toFixed(2) + '%';
    errEl.className = 'sim-stat-value ' + (point.err > 10 ? 'stat-red' : point.err > 1 ? 'stat-orange' : 'stat-green');
    const statusEl = document.getElementById('stat-status');
    if (point.err > 30 || point.rt > 2000) {
        statusEl.textContent = '崩溃'; statusEl.className = 'sim-stat-value stat-red';
    } else if (point.err > 5 || point.rt > 500) {
        statusEl.textContent = '危险'; statusEl.className = 'sim-stat-value stat-red';
    } else if (point.err > 1 || point.rt > 100) {
        statusEl.textContent = '告警'; statusEl.className = 'sim-stat-value stat-orange';
    } else {
        statusEl.textContent = '正常'; statusEl.className = 'sim-stat-value stat-green';
    }

    simTime++;
    requestAnimationFrame(drawSim);
}

// ==================== 背景粒子 ====================
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function initParticles() {
    pCanvas.width = window.innerWidth;
    pCanvas.height = window.innerHeight;
    particles = [];
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * pCanvas.width,
            y: Math.random() * pCanvas.height,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            r: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.3 + 0.1
        });
    }
}

function drawParticles() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = pCanvas.width;
        if (p.x > pCanvas.width) p.x = 0;
        if (p.y < 0) p.y = pCanvas.height;
        if (p.y > pCanvas.height) p.y = 0;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(88,166,255,${p.a})`;
        pCtx.fill();
    });
    // 连线
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                pCtx.beginPath();
                pCtx.moveTo(particles[i].x, particles[i].y);
                pCtx.lineTo(particles[j].x, particles[j].y);
                pCtx.strokeStyle = `rgba(88,166,255,${0.06 * (1 - dist / 150)})`;
                pCtx.lineWidth = 0.5;
                pCtx.stroke();
            }
        }
    }
    requestAnimationFrame(drawParticles);
}

// ==================== 滚动动画 ====================
function initScrollAnim() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                e.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
}

function initNavHighlight() {
    const links = document.querySelectorAll('.nav-link');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                links.forEach(l => l.classList.remove('active'));
                const link = document.querySelector(`.nav-link[href="#${e.target.id}"]`);
                if (link) link.classList.add('active');
            }
        });
    }, { rootMargin: '-100px 0px -60% 0px' });
    document.querySelectorAll('.section').forEach(s => observer.observe(s));
}

// ==================== 初始化 ====================
window.addEventListener('load', () => {
    renderCards('grid-traffic', termsData.traffic);
    renderCards('grid-failures', termsData.failures);
    renderCards('grid-data', termsData.data);
    renderCards('grid-metrics', termsData.metrics);
    renderCards('grid-solutions', termsData.solutions);
    initParticles();
    drawParticles();
    drawSim();
    initScrollAnim();
    initNavHighlight();
});

window.addEventListener('resize', () => {
    pCanvas.width = window.innerWidth;
    pCanvas.height = window.innerHeight;
});

// Modal
function closeModal() {
    document.getElementById('modal').classList.remove('show');
}
