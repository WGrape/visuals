<script>
/* ===== 章节 ===== */
const CHAPTERS = [
  {n:1, e:"🧱", name:"函数 · 极限 · 连续", intro:"地基章。极限算不准，后面全塌。这章练的就是「无限逼近」的直觉。", sub:"6 个知识点"},
  {n:2, e:"🚀", name:"一元函数微分学", intro:"变化率的世界。导数 = 瞬时速度，是整个微积分的发动机。", sub:"5 个知识点"},
  {n:3, e:"📐", name:"一元函数积分学", intro:"导数的逆运算，累积的艺术。面积、体积、功都是它算出来的。", sub:"4 个知识点"},
  {n:4, e:"🏔", name:"多元函数微分学", intro:"把一元导数推广到多个变量——山坡的坡度该怎么量。", sub:"3 个知识点"},
  {n:5, e:"🟦", name:"多元函数积分学（仅二重积分）", intro:"把积分从一条线铺到一整片区域，数二里唯一的多元积分。", sub:"1 个知识点"},
  {n:6, e:"🔗", name:"常微分方程", intro:"顶层综合：已知变化规律，反推原函数。把前面全串起来。", sub:"5 个知识点"},
];

/* ===== 知识点趣味讲解 ===== */
const DATA = {
  c1_func:{e:"🎰",lv:"base",intui:"函数像自动售货机：投一个 x，吐出唯一的一个 y。",
    plain:"函数就是「输入对应输出」的规则。有界 = 图像被上下两条线框住跑不出去；单调 = 一直涨或一直跌；奇偶 = 图像关于 y 轴镜像（偶）或关于原点旋转（奇）；周期 = 图像像传送带一样反复出现。复合函数 f(g(x)) 是机器套机器，先算里层 g(x)；反函数是把输入输出倒过来（x、y 互换再解 y）；初等函数是用幂、指、对、三角这些基本函数做四则和套娃拼出来的。",
    story:"想象你站在自动售货机前：投 5 元（x），它吐出一瓶可乐（y）。同一个投币口不能同一时刻吐出两瓶不同的饮料——这就是函数的「单值性」。复合函数就是你先投币进一台机器，它吐出的东西又被送进第二台机器再处理一层。反函数则是：你从出货口往回推，想知道「要得到这瓶可乐，当初投了几块钱」。",
    formula:"初等函数 = 常数 / 幂 / 指数 / 对数 / 三角 / 反三角，经四则 + 复合\n复合：f(g(x)) 先算内层 g(x)\n反函数：x、y 互换，再解出 y",
    pit:"复合函数一定先算里层；不是每个函数都有反函数，必须满足「一对一」才行。"},

  c1_limit:{e:"🏍",lv:"base",intui:"极限是你骑车冲向旗杆、撞上前那一瞬的距离——你不一定真到那点，但无限逼近它。",
    plain:"极限描述「x 越来越靠近某值时，y 越来越靠近哪个数」。左右极限就是分别从左边和右边逼近；极限存在，当且仅当左右极限都存在且相等。性质里最有用的是保号性：如果极限是正数，那附近的函数值也都是正数。",
    story:"你骑摩托车冲向悬崖边的旗杆（x→a）。极限就是你撞上去之前那一瞬间，离旗杆还有多近——这个距离无限趋近 0，但你在 a 点到底撞没撞、甚至 a 点有没有旗杆（函数在该点是否定义），都不影响极限的值。函数在那一点甚至可以有个「洞」，极限照样存在。",
    formula:"lim f(x) = A  ⇔  左极限 = 右极限 = A\n保号性：若 lim f(x)=A>0，则附近 f(x)>0",
    pit:"极限看的是「趋近的过程」，函数在那一点没定义或有洞，都不影响极限；唯一性、有界性、保号性是推理工具，不是算出来的。"},

  c1_twoimp:{e:"🔑",lv:"base",intui:"两个万能钥匙：一把开 0/0 型正弦小角，一把开 1^∞ 型「利滚利」。",
    plain:"第一个 lim sinx/x (x→0)=1：角度极小时，sin x 几乎等于 x，比值趋近 1。第二个 lim(1+1/x)^x=e：存钱利滚利，复利次数趋于无穷，本息比趋于自然常数 e。遇到这两种长相的极限直接用。",
    story:"第二个极限就是「利滚利」的数学灵魂：你存 1 块钱，年利率 100%，如果一年结算一次得 2 块；每月结算得 (1+1/12)^12≈2.61；每天结算更多……结算次数趋于无穷，这个数稳稳收敛到 e≈2.718。这就是自然常数怎么来的。",
    formula:"lim sinx/x = 1  (x→0)\nlim (1+1/x)^x = e  等价于  lim (1+u)^(1/u) = e (u→0)",
    pit:"必须长成标准形式才能直接用，变形时要先「凑」成标准样子再套。"},

  c1_criteria:{e:"🐱",lv:"base",intui:"夹逼 = 猫被两只狗夹在中间，狗蹲门口猫也只能蹲门口；单调有界 = 有封顶的数列安稳停下。",
    plain:"夹逼准则：g≤f≤h 且 g、h 极限同为 A，则 f 极限也为 A，适合求和式或含 n 的式子。单调有界准则：单调递增且有上界（或递减有下界）的数列必收敛，适合递推数列——先证单调，再证有界，就得到极限存在。",
    story:"你家的猫想从客厅去厨房，左边一只狗右边一只狗把它夹在中间。两只狗都蹲到了门口（极限都是 A），猫被夹着，也只能蹲在 A 处。这就是夹逼。单调有界则是：一个一直往上爬且头顶有天花板的数列，爬到顶就再也动不了，稳稳停在一个数上。",
    formula:"夹逼：g(n)≤f(n)≤h(n)，且 lim g = lim h = A  ⇒  lim f = A\n单调有界  ⇒  收敛",
    pit:"夹逼的上下必须都趋于同一个 A；单调有界要先证单调性，再证有界，顺序不能反。"},

  c1_inf:{e:"🔬",lv:"base",intui:"无穷小是「趋近于 0 的迷你量」，等价替换像用长得几乎一样的替身去算极限。",
    plain:"x→0 时，sinx≈x、tanx≈x、1-cosx≈x²/2、e^x-1≈x、ln(1+x)≈x。这些「等价无穷小」可以替换乘积因子来求极限，省掉大量计算。阶的比较就是看谁趋近 0 更快。",
    story:"你有一堆极小的零件，sinx 这个小零件和 x 这个小零件在 x→0 时几乎一样大，干脆用 x 当它的替身去算。但注意：替身只能顶替「相乘」的位置，如果它在加减里，直接替换会出错——就像替身不能替你去参加考试里的主观题。",
    formula:"x→0 时：sinx~x, tanx~x, 1-cosx~x²/2,\ne^x-1~x, ln(1+x)~x, (1+x)^a-1~ax, arcsinx~x",
    pit:"等价替换只能在乘除里用，加减项里用会翻车！这是新手第一坑。"},

  c1_cont:{e:"✏️",lv:"base",intui:"连续 = 画图像时笔尖不离开纸；间断点 = 笔尖必须抬起来的地方。",
    plain:"连续定义：lim f(x)=f(a)，即极限值等于函数值。间断点分类：第一类（可去、跳跃）——左右极限都存在，只是要么有个洞（可去）要么跳了一下（跳跃）；第二类（无穷、振荡）——至少一边飞到无穷或抖个不停。闭区间连续有四大定理：有界、最值、介值（中间值都能取到）、零点（两端异号必有根）。",
    story:"你拿笔画一条曲线，如果从头画到尾笔尖没离开纸，那就全程连续。遇到一个洞（可去间断），你得抬笔补一下；遇到一个台阶（跳跃），也得抬笔。两端异号的地方一定有根，就像你从零下走到零上，中途必然经过 0 度——零点定理就是这个直觉。",
    formula:"零点定理：f(a)f(b)<0 且连续  ⇒  (a,b) 内∃根\n间断点：第一类(可去/跳跃) | 第二类(无穷/振荡)",
    pit:"第一类要求左右极限都「存在」；分类前先算左右极限，别凭感觉。"},

  c2_def:{e:"🏎",lv:"core",intui:"导数就是瞬时速度——盯着速度表某一刻的读数，而不是一段平均。",
    plain:"f'(x)=lim [f(x+h)-f(x)]/h，是变化率。几何意义 = 曲线在该点的切线斜率；物理意义 = 瞬时速度、加速度等。微分 dy=f'(x)dx 是切线方向的纵坐标增量（近似值）。可导一定连续，但连续不一定可导（比如 |x| 在 0 点有个尖尖，画不出唯一切线）。",
    story:"你开车经过测速摄像头，表上显示 80 km/h——这就是「那一瞬间」的速度，是导数。平均速度是「一段路程÷一段时间」，是割线斜率；瞬时速度是把这段时间压到极短，割线变成切线，就是导数。|x| 在 0 点像一个尖屋顶，左边坡右边坡不一样，切线不唯一，所以不可导。",
    formula:"f'(x)=lim [f(x+h)-f(x)]/h\ndy = f'(x) dx\n切线：y-f(x₀)=f'(x₀)(x-x₀)",
    pit:"可导 ⇒ 连续，反过来不成立；分段函数在分界点必须用定义求导。"},

  c2_calc:{e:"🧅",lv:"core",intui:"链导 = 剥洋葱，从外往里一层层求导再相乘；隐函数 = y 偷偷是 x 的函数。",
    plain:"复合 [f(g(x))]'=f'(g(x))·g'(x)；参数方程 dy/dx=(dy/dt)/(dx/dt)；反函数导数 = 1/f'(x)；幂指或连乘用对数求导；高阶导数逐阶求；分段点用定义。",
    story:"复合函数求导像剥洋葱：最外层函数先求导，乘上里层函数的导数，再乘更里层……一层套一层。隐函数则是方程里 y 藏着没写开，但它是 x 的函数，所以对它求导时，y 自动带出 y'——就像队伍里藏着一个人，点名时他必须喊「到」并带上自己的编号。",
    formula:"链导：[f(g(x))]' = f'(g(x))·g'(x)\n参数：dy/dx = (dy/dt)/(dx/dt)\n对数求导：ln y = …  再两边对 x 求导",
    pit:"链导千万别漏乘内层导数；隐函数把 y 当 x 函数，对 x 求导每项自动产生 y'。"},

  c2_mvt:{e:"📏",lv:"core",intui:"罗尔：两端一样高的曲线中间必有水平切线；拉格朗日：中间必有切线和两端连线平行。",
    plain:"罗尔：f(a)=f(b) 且连续可导 ⇒ 存在 ξ 使 f'(ξ)=0。拉格朗日：存在 ξ 使 f(b)-f(a)=f'(ξ)(b-a)。柯西是两函数版。泰勒用多项式去逼近函数（带余项），也是极限的高精度工具。",
    story:"把一根两端一样高的绳子拉平（罗尔），中间最低或最高的地方切线一定是水平的（导数为 0）。任意一根绳子（拉格朗日），两端连一条弦，绳子中间总有某点的切线和这条弦平行。中值定理就是证明题的发动机，靠它把「两点差值」和「中间某点导数」连起来。",
    formula:"拉格朗日：f(b)-f(a)=f'(ξ)(b-a)\n泰勒：f(x)=f(x₀)+f'(x₀)(x-x₀)+f''(x₀)/2!(x-x₀)²+…",
    pit:"证 f'(ξ)=0 想罗尔；证差值与导数关系想拉格朗日。中值定理是证明题核心，别怕用。"},

  c2_lh:{e:"⚖️",lv:"core",intui:"0/0 或 ∞/∞ 像两个同时缩小的东西比大小，比不过就各自求导再比。",
    plain:"洛必达法则：对 0/0 或 ∞/∞ 型未定式，lim f/g = lim f'/g'（可用多次）。先用等价无穷小化简往往更省力，因为求导可能越求越麻烦。",
    story:"两个小人同时往 0 缩，你分不清谁大谁小，规则说：各自求导再比一次。但如果其中一方能用等价无穷小先「整容」成简单样子，通常比硬求导快得多。洛必达不是万能钥匙，有些题越求导越复杂，这时要换思路。",
    formula:"lim f(x)/g(x)  [0/0 或 ∞/∞] = lim f'(x)/g'(x)",
    pit:"只有 0/0、∞/∞ 才能用；每次用前都要重新检查是否还满足条件；不是万能，复杂时考虑化简或换法。"},

  c2_app:{e:"📈",lv:"core",intui:"f' 是涨跌幅指挥棒，f'' 是凹凸质检员。",

    formula:"单调：f'>0 增，f'<0 减\n极值：f'(x₀)=0 且两侧变号\n拐点：f''(x₀)=0 且两侧变号\n斜渐近线：a=lim f/x, b=lim(f-ax)",

  c3_indef:{e:"⏪",lv:"core",intui:"不定积分是求导的「倒带」——知道变化率，反推原样，再加个任意常数 C。",

  c3_defint:{e:"🧩",lv:"core",intui:"定积分是把曲线下面积切成无数窄条，再拼回去——不规则田地的面积算法。",
    plain:"∫ₐᵇ f dx 是黎曼和的极限（无限细分再累加）。变上限积分 Φ(x)=∫ₐˣ f(t)dt，它的导数 Φ'(x)=f(x)（微积分基本定理，超高频）。N-L 公式：∫ₐᵇ f = F(b)-F(a)。奇偶对称在对称区间能秒杀（奇函数=0）。",

    formula:"∫ₐᵇ f(x)dx = F(b)-F(a)  (N-L 公式)\nΦ(x)=∫ₐˣ f(t)dt  ⇒  Φ'(x)=f(x)\n对称区间：偶×2倍半；奇=0",

  c3_improp:{e:"♾️",lv:"core",intui:"反常积分把区间拉到无穷，或函数在某点「爆掉」，看累加到底收敛还是炸飞。",

    story:"把一条曲线 y=f(x) 和 x 轴之间的面积，绕 x 轴转一圈，就得到一个像甜甜圈切开那样的旋转体。体积就是把无数个薄圆片（面积 πy²，厚度 dx）叠起来——π∫y²dx。面积是上下曲线之差的累加 ∫(上-下)。",
    formula:"面积：∫ₐᵇ |f(x)-g(x)| dx\n旋转体体积：V=π∫ₐᵇ y² dx\n弧长：∫ₐᵇ √(1+y'²) dx",

  c4_multi:{e:"🧭",lv:"key",intui:"多元函数像山坡，偏导是「只往东走」的坡度，其他方向先冻住当常数。",

  c4_ext:{e:"🎯",lv:"key",intui:"无条件极值 = 平地上找最高最低点；条件极值 = 被绳子拴着走，只能沿绳找。",

const lvMap={base:["基础","base"],core:["核心","core"],key:["重点","key"]};
const root=document.getElementById("root");
let total=0, learned=0;
CHAPTERS.forEach(ch=>{

      </div>
      <div class="ch-sub">${ch.sub}</div>
    </div>
    <div class="grid" id="g${ch.n}"></div>`;

});
Object.keys(DATA).forEach(id=>{
  const d=DATA[id]; const [lvname,lvcls]=lvMap[d.lv];
  const grid=document.getElementById("g"+id.charAt(1)); // g + 章节号(第2字符)
  // 实际章节号：id 形如 c1_func -> 章节=id[1]
  const chnum=id.charAt(1);
  const g=document.getElementById("g"+chnum);
  total++;
  const card=document.createElement("div");
  card.className="card"; card.dataset.id=id;
  card.innerHTML=`
    <div class="c-front">
      <div class="c-emoji">${d.e}</div>
      <div class="c-main">

    </div>

      <div class="block"><div class="bt plain">🗣 大白话讲解</div><div class="bv">${d.plain}</div></div>

});
document.getElementById("tot").textContent=total;

function titleOf(id){
  const map={
    c1_func:"函数（概念/性质/复合/反/初等）",c1_limit:"极限（定义/性质/左右）",c1_twoimp:"两个重要极限",
    c1_criteria:"极限准则（夹逼/单调有界）",c1_inf:"无穷小与无穷大（等价替换）",c1_cont:"连续与间断点/闭区间性质",
    c2_def:"导数与微分（定义/意义/切线法线）",c2_calc:"导数计算（链导/隐/参数/分段）",c2_mvt:"中值定理（罗尔/拉/柯西/泰勒）",
    c2_lh:"洛必达法则",c2_app:"导数应用（单调/极值/凹凸/渐近线）",
    c3_indef:"不定积分（换元/分部/有理）",c3_defint:"定积分（N-L/变上限积分）",c3_improp:"反常积分（敛散性）",c3_app:"定积分应用（面积/体积/弧长/物理）",
    c4_multi:"多元函数（偏导/全微分）",c4_partial:"偏导计算（复合链导/隐函数）",c4_ext:"多元极值（无条件/拉格朗日）",
    c5_double:"二重积分（直角/极坐标/对称）",
    c6_concept:"微分方程基本概念",c6_first:"一阶方程（可分离/齐次/线性）",c6_reduce:"可降阶高阶方程",c6_second:"二阶常系数线性（齐次/非齐次）",c6_app:"微分方程应用（几何/物理建模）"
  };
  return map[id]||id;
}
function toggleLearn(id,btn){
  const card=btn.closest(".card");
  const on=card.classList.toggle("learned");
  btn.textContent=on?"✓ 已学会（点取消）":"✓ 我学会了";
  learned=document.querySelectorAll(".card.learned").length;
  document.getElementById("cnt").textContent=learned;
  document.getElementById("bar").style.width=(learned/total*100)+"%";
}
function toggleAll(){
  const cards=document.querySelectorAll(".card");
  const anyClosed=[...cards].some(c=>!c.classList.contains("open"));
  cards.forEach(c=>c.classList.toggle("open",anyClosed));
}
function randOpen(){
  const cards=[...document.querySelectorAll(".card")];
  const c=cards[Math.floor(Math.random()*cards.length)];
  c.classList.add("open");
  c.scrollIntoView({behavior:"smooth",block:"center"});
  const t=document.getElementById("toast");
  t.textContent="🎲 翻开："+titleOf(c.dataset.id); t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),1800);
}
