<script>
/* ===== 章节 ===== */
const CHAPTERS = [
  {n:1, e:"🔢", name:"行列式", intro:"把方阵压成「一个数」的工具，衡量线性变换把面积放大多少倍。计算的地基。", sub:"5 个知识点"},
  {n:2, e:"🎛", name:"矩阵", intro:"数表和变形机器。乘法不交换，求逆、求秩是最高频操作。", sub:"5 个知识点"},
  {n:3, e:"🧱", name:"向量", intro:"搭建线代语言的积木。线性相关 / 无关是全章灵魂概念。", sub:"5 个知识点"},
  {n:4, e:"🧮", name:"线性方程组", intro:"线代的主线应用。解的存在性、结构全靠「秩」来判。", sub:"4 个知识点"},
  {n:5, e:"🔑", name:"特征值与特征向量", intro:"找矩阵里「方向不变只缩放」的硬骨头，对角化的钥匙。", sub:"3 个知识点"},
  {n:6, e:"🍜", name:"二次型", intro:"二次齐次多项式，标准化和正定，常与特征值打通出大题。", sub:"3 个知识点"},
];

/* ===== 知识点趣味讲解 ===== */
const DATA = {
  l1_concept:{e:"📏",lv:"base",intui:"行列式是把方阵「压缩」成一个数的魔法，衡量变换把面积放大几倍。",
    plain:"n 阶行列式是由 n² 个数按规则算出的一个标量。交换两行变号；转置值不变 |A|=|Aᵀ|；二、三阶可用对角线法则；代数余子式 Aᵢⱼ=(-1)^(i+j)Mᵢⱼ（M 是划掉第 i 行第 j 列剩下的式子）。",
    story:"一个 2×2 矩阵代表一个平面变换（拉伸、旋转、剪切）。它把单位正方形变成平行四边形，行列式就是这平行四边形的「有向面积」——正数表示没翻面，负数表示翻面了。所以行列式既是一个数，又带着「方向」信息。",
    formula:"二阶：|a b; c d| = ad − bc\n|Aᵀ| = |A|；交换两行(列) ⇒ 变号\n代数余子式 Aᵢⱼ = (−1)ⁱ⁺ʲ Mᵢⱼ",
    pit:"行列式是一个数（不是矩阵）；|kA|=kⁿ|A| 而不是 k|A|，这个 n 次方最容易被忘。"},

  l1_prop:{e:"🪓",lv:"base",intui:"化简三板斧：倍加不变、换行变号、提公因子。",
    plain:"四条核心性质：①某行 k 倍加另一行，值不变（初等行变换基础）；②交换两行变号；③某行公因子可提出；④两行成比例则值为 0。利用这些把行列式化简单再算。",
    story:"倍加不变就像天平两端同时加等重的砝码，还是平衡的（值不变）。换行变号像把一张纸翻面，有向面积符号翻了。提公因子是「这一行人人都有 k，先提出来」；两行成比例等于这两行线性相关，面积被压扁成 0。",
    formula:"① 第i行k倍加第j行 ⇒ |A|不变\n② 交换两行 ⇒ |A|变号\n③ 第i行提公因子k ⇒ |A|含因子k\n④ 两行成比例 ⇒ |A|=0",
    pit:"倍加才是「不变」，乘常数要提公因子；换行必变号，别漏负号。"},

  l1_expand:{e:"🧩",lv:"base",intui:"按行展开 = 把大行列式拆成几个小行列式之和，逐次降阶。",
    plain:"行列式等于某行（列）各元素与其代数余子式乘积之和：|A|=Σ aᵢⱼAᵢⱼ。选含 0 最多的行/列展开，把 n 阶降为 n−1 阶，最省力。",
    story:"你要把一件大事分解成几件小事，每件再小一点。哪一行 0 最多，就从那行展开——因为乘以 0 的项直接消失，剩下的少。不同行的元素乘另一行的代数余子式之和 = 0，这是个易错的反向性质。",
    formula:"|A| = aᵢ₁Aᵢ₁ + aᵢ₂Aᵢ₂ + … + aᵢₙAᵢₙ  (按第i行)\n不同行(列)元素与代数余子式乘积之和 = 0",
    pit:"选 0 多的行/列展开；别把另一行的代数余子式乱乘进去（那类和为 0）。"},

  l1_calc:{e:"🔺",lv:"base",intui:"化上三角最稳——把矩阵削成主对角线以上全 0，主对角线一乘就是答案。",
    plain:"标准套路：用性质做初等行变换把行列式化成上三角，值 = 主对角线乘积；或按含 0 多的行/列展开降阶；特殊结构用递推或公式。",
    story:"就像整理一团乱麻，先把它梳成从上往下的三角（主对角线以上全是 0），这时行列式的值就是主对角线上那些数相乘——干净利落，几乎不会算错。",
    formula:"上三角行列式 = a₁₁a₂₂…aₙₙ\n化三角：倍加消元 → 主元乘积",
    pit:"化三角时如果换了行，记得变号；答案一定是主对角线乘积。"},

  l1_special:{e:"🏹",lv:"base",intui:"认出特殊结构直接套公式：范德蒙德 = 所有大减小乘积；箭形先消边角。",
    plain:"范德蒙德行列式 V=∏_{i<j}(xⱼ−xᵢ)；箭形/爪形（主对角线 + 一行一列）可消成对角；递推型按行展开找递推关系。",
    story:"范德蒙德长得像「每一行是 x 的不同次幂」，认出来就不用算，直接把「所有后面的减前面的」乘起来就行。箭形（主对角加一圈）则像先拔掉四角的刺，消成对角阵。认结构比硬算快十倍。",
    formula:"范德蒙德：|1…1; x₁…xₙ; …; x₁ⁿ⁻¹…xₙⁿ⁻¹| = ∏_{i<j}(xⱼ−xᵢ)",
    pit:"范德蒙德要求指数按 0,1,…,n−1 排列；注意是 xⱼ−xᵢ（j>i），顺序反了符号错。"},

  l2_concept:{e:"🎰",lv:"core",intui:"矩阵是一张数表 / 一台变形机器；乘法不交换——穿袜再穿鞋 ≠ 穿鞋再穿袜。",
    plain:"加减需同型；乘法满足结合律但不满足交换律（AB≠BA 一般）；转置 (AB)ᵀ=BᵀAᵀ；|AB|=|A||B|；|kA|=kⁿ|A|。",
    story:"矩阵乘法是「前一个的列配后一个的行」，顺序一换配对方式全变，结果自然不同——就像先穿袜子再穿鞋是合理的，反过来不行。|kA| 是把每一行都提一个 k 出来，n 行就有 kⁿ，不是 k。",
    formula:"AB ≠ BA (一般)\n(AB)ᵀ = BᵀAᵀ；(Aᵀ)ᵀ=A\n|AB|=|A||B|；|kA|=kⁿ|A|；Aᵏ 为 k 次幂",
    pit:"矩阵乘法不交换！|kA|=kⁿ|A| 别漏 n 次方。"},

  l2_inverse:{e:"↩️",lv:"core",intui:"逆矩阵就是「撤销键」：A 干了啥，A⁻¹ 反着来，乘起来还原成单位阵。",
    plain:"A 可逆 ⇔ |A|≠0 ⇔ r(A)=n（满秩）⇔ 特征值全非零。求逆两法：伴随法 A⁻¹=A*/|A|（适合二阶速算）；初等变换法 [A|E]→[E|A⁻¹]（最常用）。",
    story:"你按了 A 这个操作按钮，A⁻¹ 就是「撤销」按钮，A·A⁻¹=E（还原成什么都不做的单位阵）。解矩阵方程 AX=B 时，两边左乘 A⁻¹ 即得 X=A⁻¹B。注意是「左乘」，因为乘法不交换。",
    formula:"A⁻¹ = A*/|A|  (A*为伴随矩阵)\n[A | E] --行变换--> [E | A⁻¹]\n(A⁻¹)⁻¹=A；(AB)⁻¹=B⁻¹A⁻¹",
    pit:"求逆首选 [A|E] 行变换；(AB)⁻¹=B⁻¹A⁻¹，顺序反了！"},

  l2_elementary:{e:"🔧",lv:"core",intui:"三种初等变换 = 交换两行 / 某行乘常数 / 某行 k 倍加另一行，每次 = 左乘一个初等矩阵。",
    plain:"一次初等行变换等价于左乘一个初等矩阵。行变换可求秩、求逆、解方程组——是线代最高频操作之一。",
    story:"把初等行变换想成给矩阵按了三个按钮之一。数学上，每按一次按钮，等价于左边乘上一个对应的「初等矩阵」。所以行变换和左乘初等矩阵是一回事，只是写法不同。",
    formula:"初等行变换 ⇔ 左乘初等矩阵\n行阶梯形中非零行数 = r(A)",
    pit:"行变换 ⇔ 左乘初等矩阵；求逆用 [A|E] 只用行变换，别混用列变换。"},

  l2_rank:{e:"👥",lv:"core",intui:"秩就是矩阵里「真正独立」的行/列数——队伍里能独立干活的人数。",
    plain:"秩 r(A)=行阶梯形中非零行的行数 = 列向量组的秩 = 最高阶非零子式的阶。性质：r(AB)≤min{r(A),r(B)}；r(A)=n ⇔ 满秩 ⇔ 可逆。",
    story:"一支队伍 5 个人，但其中有 2 个只是跟班（能被别人线性表示），真正独立能干活的只有 3 个——秩就是 3。秩是贯穿线代全书的「红线」，可逆、相关、方程组解的存在性都看它。",
    formula:"r(A) = 行阶梯形非零行数\nr(AB) ≤ min{r(A), r(B)}\nr(A)=n ⇔ 满秩 ⇔ 可逆",
    pit:"秩 ≤ 行数也 ≤ 列数；r(AB) 不超过两者中较小者；满秩才可逆。"},

  l2_block:{e:"🍱",lv:"core",intui:"分块 = 把大矩阵切豆腐块，每块当成一个「大元素」来算。",
    plain:"把大矩阵分成若干子块分别运算。准对角阵、分块三角阵的求逆与乘法有简便公式；带零块的矩阵用分块可大幅降计算量。",
    story:"一个大矩阵像一盒拼好的寿司，你把它按格子看成几块，每块当一个数来加减乘，公式几乎不变。带零块的矩阵分块后，很多块是 0，计算量瞬间砍掉一大半。",
    formula:"分块对角：diag(A,B) 的逆 = diag(A⁻¹,B⁻¹)\n分块乘法按块当作'元素'相乘",
    pit:"带零块的矩阵优先分块；分块乘法的分块方式要兼容（内维匹配）。"},

  l3_concept:{e:"🏹",lv:"key",intui:"向量就是一个数表的一「列」；加减数乘按分量来。",
    plain:"n 维向量是有序 n 元组（默认列向量）。线性运算：加法（对应分量加）、数乘。向量是矩阵的列/行，是后续所有概念的载体。",
    story:"向量就像一支带方向的箭头，在 n 维空间里用 n 个数定位。把矩阵的每一列抽出来，就是一个个向量。后面所有的「相关、表示、秩」都是在说这些箭头之间的关系。",
    formula:"α±β = (aᵢ±bᵢ)；kα = (k aᵢ)\n向量是矩阵的列（或行）",
    pit:"默认列向量；线性运算必须同维，分量对分量。"},

  l3_represent:{e:"🧩",lv:"key",intui:"β 能由 α 组表示 = 用这些「积木」能拼出 β。",
    plain:"β 可由 α₁…αₛ 线性表示 ⇔ 存在数 kᵢ 使 β=Σkᵢαᵢ ⇔ 非齐次方程组有解 ⇔ r(α组)=r(α组,β)。",
    story:"你有一堆积木 α，问能不能拼出目标 β。这等价于解一个方程：每个积木取多少份加起来等于 β。拼得出来 ⇔ 那个非齐次方程组有解 ⇔ 加上 β 后秩不增加。",
    formula:"β 可由 α组 表示 ⇔ r(α₁…αₛ) = r(α₁…αₛ, β)\n⇔ 非齐次方程组 x₁α₁+…+xₛαₛ=β 有解",
    pit:"能否表示 = 非齐次是否有解；比较秩是最直接的判据。"},

  l3_depend:{e:"🔗",lv:"key",intui:"线性相关 = 这组里有人「多余」，能被别人凑出来；无关 = 谁也替代不了谁。",
    plain:"α₁…αₛ 线性相关 ⇔ 存在不全为零的数使 Σkᵢαᵢ=0 ⇔ 齐次 Ax=0 有非零解 ⇔ r(A)<s。n 个 n 维向量相关 ⇔ |A|=0。",
    story:"几个人合影，如果有人只是别人的复制粘贴（能被线性组合出来），这张照片就「冗余」了——相关。如果每个人都是独一份、缺一不可，就是无关。判别就看齐次方程 Ax=0 有没有非零解，或秩是不是小于向量个数。",
    formula:"线性相关 ⇔ Ax=0 有非零解 ⇔ r(α组) < s\nn个n维向量：相关 ⇔ |A|=0",
    pit:"相关 ⇔ 齐次有非零解 ⇔ r<s；判别多用秩，别凭感觉。"},

  l3_maxrank:{e:"👑",lv:"key",intui:"极大无关组 = 从一堆向量里挑出的「核心成员」，其余人都可被他们表示。",

    story:"一班人里选出几个最能干、且彼此独立的「骨干」（极大无关组），班上其他人都能被这几个骨干的组合代替。个数就是向量组的秩。实操：把向量当列排成矩阵，行变换化阶梯形，主元所在的列对应的原向量就是骨干。",
    formula:"向量组的秩 = 对应矩阵的秩\n求法：列向量排成矩阵 → 初等行变换 → 主元列",

  l3_inner:{e:"📐",lv:"key",intui:"内积 = 两向量的「相似度投影」；施密特 = 把一组向量逐个去投影改造成互相垂直。",
    plain:"内积 ⟨α,β⟩=αᵀβ。施密特过程把线性无关组改造为正交组再单位化，得标准正交基，为实对称矩阵正交对角化准备。",
    story:"内积像量两箭头「有多同向」。施密特正交化则是：拿第一个当基准，第二个减去它在第一个上的投影（去掉同向成分），第三个再减去在前两个上的投影……最后每个人都和别人垂直，再各自归一化长度得 1，就是标准正交基。",
    formula:"投影：proj_β α = ⟨α,β⟩/⟨β,β⟩ · β\n施密特：βₖ = αₖ − Σ⟨αₖ,βᵢ⟩/⟨βᵢ,βᵢ⟩·βᵢ",
    pit:"施密特先正交再单位化；正交 ≠ 单位化（长度还得归一）。"},

  l4_cramer:{e:"🎫",lv:"base",intui:"克拉默 = 用行列式直接写出每个未知数 xᵢ=|Aᵢ|/|A|，但要方阵且 |A|≠0。",
    plain:"n 个方程 n 未知、且 |A|≠0 时，xᵢ=|Aᵢ|/|A|，其中 Aᵢ 是把 A 第 i 列换成常数列。只适用于系数行列式非零的方阵情形。",
    story:"克拉默像一张「答题卡」：每个未知数的解，就是把系数行列式里对应那列换成答案列，再除以原行列式。但它只认「方程数 = 未知数且满秩」的方阵，否则不能用——大题里一般直接用行变换更实用。",
    formula:"xᵢ = |Aᵢ| / |A|  (|A|≠0, Aᵢ为第i列换常数项)",
    pit:"仅当 |A|≠0 且方程数=未知数可用；大题多用行变换更实用。"},

  l4_judge:{e:"🔍",lv:"core",intui:"非齐次有解 ⇔ 系数矩阵和增广矩阵「秩相同」。",
    plain:"齐次 Ax=0 有非零解 ⇔ r(A)<n（唯一零解 ⇔ r(A)=n）。非齐次 Ax=b 有解 ⇔ r(A)=r(A|b)；无穷解 ⇔ r(A)=r(A|b)<n；无解 ⇔ r(A|b)=r(A)+1。",
    story:"增广矩阵就是系数矩阵右边多一列答案。如果加了答案列之后秩「涨了」，说明答案和前面的方程矛盾——无解。如果秩没变，说明答案没带来新信息——有解。含参数的方程组，就靠调参数让秩满足条件。",
    formula:"Ax=0 有非零解 ⇔ r(A) < n\nAx=b 有解 ⇔ r(A) = r(A|b)\n无穷解 ⇔ r(A)=r(A|b)<n；无解 ⇔ r(A|b)=r(A)+1",
    pit:"非齐次有解 ⇔ r(A)=r(A|b)；含参先讨论参数使秩满足条件。"},

  l4_homsol:{e:"🌱",lv:"core",intui:"齐次基础解系 = Ax=0 的最小独立解集，共 n−r 个；通解是它们的任意组合。",
    plain:"基础解系是 Ax=0 的一组线性无关解 ξ₁…ξ_{n−r}（共 n−r 个，r=r(A)）。通解 = k₁ξ₁+…+k_{n−r}ξ_{n−r}（k 任意常数）。",
    story:"齐次方程 Ax=0 的解构成一个「解空间」，像个平面或直线。基础解系就是撑起这个空间的最少几根「骨架」向量（个数 = n−r），通解则是用任意系数把这些骨架线性组合起来，张成整个解空间。",
    formula:"基础解系个数 = n − r(A)\n通解 = k₁ξ₁ + … + k_{n−r}ξ_{n−r}",
    pit:"个数 = n−r；行变换化最简形，令自由变量取 (1,0),(0,1)… 读出基础解系。"},

  l4_inhsol:{e:"🧱",lv:"core",intui:"非齐次通解 = 一个特解（具体一个）+ 齐次通解（免费送的所有解）。",
    plain:"非齐次通解 = 一个特解 η* + 齐次通解。即 η = η* + k₁ξ₁+…。性质：两解之差是齐次解；特解+齐次解仍是非齐次解。",
    story:"非齐次方程的解集像一个「平移后的子空间」：先找到一个具体的解（特解，像锚点），再加上齐次方程的所有解（自由浮动部分），就把整个解集都覆盖了。两个非齐次解相减，正好消掉特解，剩下一个齐次解。",
    formula:"Ax=b 通解 = η* + k₁ξ₁+…+k_{n−r}ξ_{n−r}\n若 η₁,η₂ 是解 ⇒ η₁−η₂ 是 Ax=0 的解",
    pit:"非齐次通解 = 特解 + 齐次通解；两解之差是齐次解，这个性质常用来构造解。"},

  l5_concept:{e:"🦴",lv:"core",intui:"特征向量是矩阵的「硬骨头」：作用后只被拉长/缩短（λ倍），方向不变。λ 是拉伸倍数。",
    plain:"满足 Aα=λα（α≠0）的 λ 为特征值、α 为对应特征向量。求法：解 |A−λE|=0 得 λ，再解 (A−λE)x=0 得 α。不同特征值对应特征向量线性无关。性质：Σλᵢ=tr(A)（迹），Πλᵢ=|A|。",
    story:"矩阵作用在一个普通向量上，一般会把它扭向别的方向。但特征向量特殊：被作用后只是沿原方向伸缩了 λ 倍，方向纹丝不动——像掰不弯的硬骨头。λ 就是伸缩比例。所有 λ 加起来等于矩阵对角线和（迹），乘起来等于行列式。",
    formula:"|A−λE| = 0 ⇒ 特征值 λ\n(A−λE)x = 0 ⇒ 特征向量\nΣλᵢ = tr(A)；Πλᵢ = |A|",
    pit:"|A−λE|=0 求 λ，(A−λE)x=0 求 α；和=迹、积=|A|，这两个性质常直接考。"},

  l5_similar:{e:"🔄",lv:"core",intui:"相似 = 换一套坐标系看同一个变换；可对角化 = 能把它变成只有对角线。",
    plain:"B=P⁻¹AP 称 A 相似于 B，相似矩阵特征值相同。A 可对角化 ⇔ 有 n 个线性无关特征向量 ⇔ 每个 k 重特征值 λᵢ 的几何重数 = 代数重数。",
    story:"同一个变换，你换一套观察的坐标系（基），矩阵模样变了（相似），但本质不变（特征值相同）。如果能找到一组基让矩阵变成对角阵（只有对角线有数），计算就极简单——可对角化的充要条件，就是每个重根特征值都能凑够「重数」个线性无关特征向量。",
    formula:"P⁻¹AP = Λ (Λ对角)\n可对角化 ⇔ n个线性无关特征向量\n⇔ 每重根λᵢ: 几何重数 = 代数重数",
    pit:"可对角化 ⇔ 每个重根特征向量个数 = 重数；不同特征值的特征向量自动无关。"},

  l5_symmetric:{e:"💎",lv:"core",intui:"实对称矩阵是「最乖」的矩阵——必能用正交阵对角化，不同特征值的特征向量天生正交。",
    plain:"实对称矩阵必可正交对角化：不同特征值的特征向量已正交，重根内用施密特正交化再单位化，得正交阵 Q 使 QᵀAQ=Λ（注意是 Qᵀ 不是 Q⁻¹，因 Q⁻¹=Qᵀ）。",
    story:"实对称矩阵像水晶，结构最规整：它一定能被一组互相垂直的单位向量（正交阵 Q）对角化。不同特征值的特征向量本来就垂直，重根那一撮用施密特掰正交再归一化就行。因为 Q 正交，Q⁻¹=Qᵀ，所以写 QᵀAQ 而不是 Q⁻¹AQ。",
    formula:"实对称 ⇒ ∃正交阵Q使 QᵀAQ = diag(λ₁…λₙ)\n步骤：求λ → 求α → 正交化 → 单位化 → 拼Q",
    pit:"QᵀAQ=Λ（Q 正交，Q⁻¹=Qᵀ）；列必须标准正交，顺序和 Λ 对角元对应。"},

  l6_matrix:{e:"🍜",lv:"key",intui:"二次型 = 一堆平方项 + 交叉项，写成 f=xᵀAx，A 是对称矩阵。",
    plain:"二次型 f=Σaᵢᵢxᵢ²+2Σaᵢⱼxᵢxⱼ 可写为 f=xᵀAx，A 为对称矩阵：aᵢᵢ=平方项系数，aᵢⱼ=aⱼᵢ=交叉项系数的一半。",
    story:"二次型就是没有一次项和常数项的二次多项式，像一碗面里各种配料的平方和两两相乘。为了用矩阵表示，把交叉项 xᵢxⱼ 的系数一分为二，一半放 (i,j) 一半放 (j,i)，保证 A 对称——这样 xᵀAx 展开才和原式一致。",
    formula:"f = xᵀAx，A对称\naᵢᵢ = xᵢ²系数；aᵢⱼ=aⱼᵢ = xᵢxⱼ系数 / 2",
    pit:"交叉项系数除以 2 分到对称两边；A 必须对称，否则 xᵀAx 展开对不上。"},

  l6_standard:{e:"📏",lv:"key",intui:"标准形 = 把二次型「理顺」成只有平方项（没有交叉项）。",
    plain:"标准形是只含平方项的形式。正交变换法：求 A 的特征值/特征向量 → 正交单位化得 Q，令 x=Qy，f=Σλᵢyᵢ²。配方法：逐次配平方换元。",
    story:"二次型里 xᵢxⱼ 这种交叉项最碍事。正交变换法最规范：用特征值当新系数，旋转坐标系把交叉项全消掉，得到 f=λ₁y₁²+…+λₙyₙ²。配方法则是手算技巧，逐次配方换元。两种方法都能把「歪的面」摆正。",
    formula:"正交变换：x=Qy ⇒ f = λ₁y₁²+…+λₙyₙ²\n配方法：配平方令新变量",
    pit:"正交变换标准形系数 = 特征值（顺序和 Q 列对应）；配方法注意换元要一一对应。"},

  l6_positive:{e:"✅",lv:"key",intui:"正定 = 不管往哪个方向（x≠0）喂进去，f 都吐出正数。",
    plain:"A 正定（f>0 对任意 x≠0）⇔ 特征值全>0 ⇔ 顺序主子式全>0 ⇔ 正惯性指数 p=n ⇔ 标准形系数全正。四条等价，判别任选。",
    story:"正定矩阵像一个「永远朝上开口的碗」：从任何方向（非零向量）探进去，函数值都 >0，没有凹下去的地方。手算最常用「顺序主子式全 >0」——就是左上角的 1 阶、2 阶……n 阶行列式全为正。等价条件里特征值全正也常用。",
    formula:"A正定 ⇔ 特征值全>0\n⇔ 顺序主子式 Δ₁,Δ₂,…,Δₙ 全>0\n⇔ 正惯性指数 p = n",
    pit:"正定 ⇔ 顺序主子式全>0（最常用手算判据）；等价于特征值全正、标准形系数全正。"}
};

/* ===== 渲染 ===== */
const lvMap={base:["基础","base"],core:["核心","core"],key:["重点","key"]};
const root=document.getElementById("root");
let total=0;
CHAPTERS.forEach(ch=>{
  const sec=document.createElement("section");
  sec.className="chapter"; sec.id="ch"+ch.n;
  sec.innerHTML=`
    <div class="ch-head">
      <div class="ch-emoji">${ch.e}</div>
      <div>
        <div class="ch-title">第${ch.n}章 · ${ch.name}</div>
        <div class="ch-intro">${ch.intro}</div>
      </div>
      <div class="ch-sub">${ch.sub}</div>
    </div>
    <div class="grid" id="g${ch.n}"></div>`;
  root.appendChild(sec);
});
function titleOf(id){
  const map={
    l1_concept:"行列式概念（n阶/转置/余子式）",l1_prop:"行列式性质（倍加/换行/提公因子）",l1_expand:"按行（列）展开定理",l1_calc:"行列式计算（化三角/降阶）",l1_special:"特殊行列式（范德蒙德/箭形）",
    l2_concept:"矩阵概念与运算（乘/转置/幂/|AB|）",l2_inverse:"逆矩阵（判定/伴随/初等变换）",l2_elementary:"初等变换与初等矩阵",l2_rank:"矩阵的秩",l2_block:"分块矩阵",
    l3_concept:"向量概念与线性运算",l3_represent:"线性组合与线性表示",l3_depend:"线性相关与线性无关",l3_maxrank:"极大线性无关组与秩",l3_inner:"内积与施密特正交化",
    l4_cramer:"克拉默法则",l4_judge:"有解判定（齐次/非齐次）",l4_homsol:"齐次方程组基础解系与通解",l4_inhsol:"非齐次方程组通解与解的结构",
    l5_concept:"特征值与特征向量（定义/性质/求法）",l5_similar:"相似矩阵与可对角化",l5_symmetric:"实对称矩阵正交相似对角化",
    l6_matrix:"二次型的矩阵表示",l6_standard:"化标准形（正交变换/配方法）",l6_positive:"正定二次型与正定矩阵"
  };
  return map[id]||id;
}
Object.keys(DATA).forEach(id=>{
  const d=DATA[id]; const [lvname,lvcls]=lvMap[d.lv];
  const chnum=id.charAt(1);
  const g=document.getElementById("g"+chnum);
  total++;
  const card=document.createElement("div");
  card.className="card"; card.dataset.id=id;
  card.innerHTML=`
    <div class="c-front">
      <div class="c-emoji">${d.e}</div>
      <div class="c-main">
        <div class="c-title">${titleOf(id)}<span class="lv ${lvcls}">${lvname}</span></div>
        <div class="c-intui">${d.intui}</div>
        <div class="c-hint">👆 点开看大白话 + 比喻 + 公式 + 新手坑</div>
      </div>
    </div>
    <div class="detail"><div class="detail-in">
      <div class="block"><div class="bt plain">🗣 大白话讲解</div><div class="bv">${d.plain}</div></div>
      <div class="block"><div class="bt story">🎨 形象比喻</div><div class="bv">${d.story}</div></div>
      <div class="block"><div class="bt formula">📐 公式（人话版）</div><div class="bv formula">${d.formula}</div></div>
      <div class="block"><div class="bt pit">⚠️ 新手坑</div><div class="bv"><span class="pill">${d.pit}</span></div></div>
      <div class="learn">
        <button class="btn" onclick="toggleLearn('${id}',this)">✓ 我学会了</button>
        <span class="learned-tag">🎉 已点亮！</span>
      </div>
    </div></div>`;
  card.querySelector(".c-front").onclick=()=>card.classList.toggle("open");
  g.appendChild(card);
});
document.getElementById("tot").textContent=total;

function toggleLearn(id,btn){
  const card=btn.closest(".card");
  const on=card.classList.toggle("learned");
  btn.textContent=on?"✓ 已学会（点取消）":"✓ 我学会了";
  const learned=document.querySelectorAll(".card.learned").length;
  document.getElementById("cnt").textContent=learned;
  document.getElementById("bar").style.width=(learned/total*100)+"%";
}
function toggleAll(){
  const cards=document.querySelectorAll(".card");
  const anyClosed=[...cards].some(c=>!c.classList.contains("open"));
  cards.forEach(c=>c.classList.toggle("open",anyClosed));
}
function randOpen(){
  const cards=[...document.querySelectorAll(".card")];
  const c=cards[Math.floor(Math.random()*cards.length)];
  c.classList.add("open");
  c.scrollIntoView({behavior:"smooth",block:"center"});
  const t=document.getElementById("toast");
  t.textContent="🎲 翻开："+titleOf(c.dataset.id); t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),1800);
}
</script>
