<body>

<script>
/* ============ 通用绘图引擎 ============ */
const PALETTE = ['#e8212b','#1565c0','#2e7d32','#ef6c00','#6a1b9a','#00838f','#c2185b','#558b2f'];

function niceStep(x){
  if(x<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const f = x/p;
  let nf;
  if(f<1.5) nf=1; else if(f<3) nf=2; else if(f<7) nf=5; else nf=10;
  return nf*p;
}
function ticks(min,max,n){
  const step = niceStep((max-min)/n);
  const start = Math.ceil(min/step-1e-9)*step;
  const arr=[];
  for(let v=start; v<=max+1e-9; v+=step) arr.push(v);
  return arr;
}

function render(spec, hover){
  const cv = spec.canvas, wrap = cv.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  // ranges
  let {xmin,xmax,ymin,ymax} = spec;
  if(spec.square){
    const yr = ymax-ymin, xc = (spec.xc!=null?spec.xc:0);
    const xr = yr*(W/H);
    xmin = xc - xr/2; xmax = xc + xr/2;
  }
  const dx = xmax-xmin, dy = ymax-ymin;
  const toPx = (x)=> (x-xmin)/dx * W;
  const toPy = (y)=> H - (y-ymin)/dy * H;

  // grid
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#eef1f6';
  ctx.font = '11px -apple-system,sans-serif';
  ctx.fillStyle = '#9aa5b5';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ticks(xmin,xmax,8).forEach(v=>{
    if(Math.abs(v)<1e-9) return;
    const px = toPx(v);
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke();
  });
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ticks(ymin,ymax,6).forEach(v=>{
    if(Math.abs(v)<1e-9) return;
    const py = toPy(v);
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke();
  });

  // axes
  ctx.strokeStyle = '#9aa5b5'; ctx.lineWidth = 1.4;
  const ox = toPx(0), oy = toPy(0);
  const cx = (ox>=0 && ox<=W)? ox : (ox<0?0:W);
  const cy = (oy>=0 && oy<=H)? oy : (oy<0?0:H);
  if(ymin<=0 && ymax>=0){ ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke(); }
  if(xmin<=0 && xmax>=0){ ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke(); }

  // arrowheads
  ctx.fillStyle='#9aa5b5';
  const ah=6;
  if(ox>=0&&ox<=W){ ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox-ah,ah*1.3); ctx.lineTo(ox+ah,ah*1.3); ctx.closePath(); ctx.fill(); }
  if(oy>=0&&oy<=H){ ctx.beginPath(); ctx.moveTo(W,oy); ctx.lineTo(W-ah*1.3,oy-ah); ctx.lineTo(W-ah*1.3,oy+ah); ctx.closePath(); ctx.fill(); }

  // axis labels
  ctx.fillStyle='#7b8794'; ctx.font='12px -apple-system,sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText('x', Math.min(W-4, ox+14), oy+4);
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('y', ox+5, Math.max(12, oy-4));

  // tick numbers
  ctx.fillStyle='#aab2bd'; ctx.font='10.5px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ticks(xmin,xmax,8).forEach(v=>{
    if(Math.abs(v)<1e-9) return;
    const px=toPx(v);
    if(px<14||px>W-14) return;
    const ty = (oy>=0&&oy<=H)? Math.min(H-14, oy+4) : 4;
    let lab = Math.abs(v)>=1000? v.toExponential(0) : (Math.abs(v-Math.round(v))<1e-9? String(Math.round(v)) : v.toFixed(1));
    ctx.fillText(lab, px, ty);
  });
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ticks(ymin,ymax,6).forEach(v=>{
    if(Math.abs(v)<1e-9) return;
    const py=toPy(v);
    if(py<10||py>H-10) return;
    const tx = (ox>=0&&ox<=W)? Math.min(W-4, ox-5) : (ox<0? W-4 : 4);
    let lab = Math.abs(v)>=1000? v.toExponential(0) : (Math.abs(v-Math.round(v))<1e-9? String(Math.round(v)) : v.toFixed(1));
    ctx.fillText(lab, tx, py);
  });

  // draw series
  const pad = 0.6; // allow slight overflow before breaking line
  function drawPath(pts, color, width, dash){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.setLineDash(dash||[]);
    ctx.beginPath();
    let started=false;
    for(const p of pts){
      if(p==null){ started=false; continue; }
      if(!started){ ctx.moveTo(p[0],p[1]); started=true; }
      else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(spec.mode==='yfx'){
    const N=900;
    spec.series.forEach((s,si)=>{
      const pts=[];
      let prevY=null;
      for(let i=0;i<=N;i++){
        const x = xmin + dx*i/N;
        let y;
        try{ y=s.fn(x); }catch(e){ y=NaN; }
        if(!isFinite(y) || y<ymin-1e9 || y>ymax+1e9){ pts.push(null); prevY=null; continue; }
        // break on huge jumps (vertical asymptotes)
        if(prevY!=null && Math.abs(y-prevY) > dy*(1+pad)){ pts.push(null); }
        pts.push([toPx(x),toPy(y)]);
        prevY=y;
      }
      drawPath(pts, s.color||PALETTE[si], s.width||2.2, s.dash);
    });
  } else if(spec.mode==='parametric'){
    const N=1000;
    spec.series.forEach((s,si)=>{
      const pts=[];
      for(let i=0;i<=N;i++){
        const t = s.tmin + (s.tmax-s.tmin)*i/N;
        let x,y;
        try{ x=s.xf(t); y=s.yf(t); }catch(e){ pts.push(null); continue; }
        if(!isFinite(x)||!isFinite(y)){ pts.push(null); continue; }
        pts.push([toPx(x),toPy(y)]);
      }
      drawPath(pts, s.color||PALETTE[si], s.width||2.2, s.dash);
    });
  } else if(spec.mode==='polar'){
    const N=1400;
    spec.series.forEach((s,si)=>{
      const pts=[];
      for(let i=0;i<=N;i++){
        const th = s.tmin + (s.tmax-s.tmin)*i/N;
        let r;
        try{ r=s.rf(th); }catch(e){ pts.push(null); continue; }
        if(!isFinite(r)){ pts.push(null); continue; }
        const x=r*Math.cos(th), y=r*Math.sin(th);
        pts.push([toPx(x),toPy(y)]);
      }
      drawPath(pts, s.color||PALETTE[si], s.width||2.2, s.dash);
    });
  }

  // vertical / horizontal reference lines
  spec.series.forEach(s=>{
    if(s.vline!=null){
      const px=toPx(s.vline);
      if(px>=0&&px<=W){
        ctx.strokeStyle=s.color||'#888'; ctx.lineWidth=s.width||1.5; ctx.setLineDash(s.dash||[4,4]);
        ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    if(s.hline!=null){
      const py=toPy(s.hline);
      if(py>=0&&py<=H){
        ctx.strokeStyle=s.color||'#888'; ctx.lineWidth=s.width||1.5; ctx.setLineDash(s.dash||[4,4]);
        ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  });

  // hover overlay
  if(hover){
    const hx = toPx(hover.x), hy = toPy(hover.y);
    ctx.strokeStyle='rgba(37,99,235,.35)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(hx,0); ctx.lineTo(hx,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();
    ctx.setLineDash([]);
    if(spec.mode==='yfx'){
      spec.series.forEach((s,si)=>{
        let y; try{ y=s.fn(hover.x); }catch(e){ y=NaN; }
        if(isFinite(y) && y>=ymin-pad && y<=ymax+pad){
          const py=toPy(y);
          ctx.fillStyle=s.color||PALETTE[si];
          ctx.beginPath(); ctx.arc(hx,py,3.5,0,Math.PI*2); ctx.fill();
        }
      });
    } else {
      ctx.fillStyle='#e8212b';
      ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill();
    }
    // coordinate box
    let txt;
    if(spec.mode==='yfx'){
      const ys = spec.series.map(s=>{ let y; try{y=s.fn(hover.x);}catch(e){y=NaN;} return isFinite(y)?y.toFixed(3):'—'; });
      txt = 'x='+hover.x.toFixed(3)+'  '+spec.series.map((s,i)=>s.label.split(' ')[0]+':'+ys[i]).join('  ');
    } else {
      txt = '('+hover.x.toFixed(3)+', '+hover.y.toFixed(3)+')';
    }
    ctx.font='11px -apple-system,sans-serif';
    const tw = ctx.measureText(txt).width+12;
    let bx = hx+8, by = hy-22;
    if(bx+tw>W) bx = hx-tw-8;
    if(by<2) by = hy+8;
    ctx.fillStyle='rgba(31,39,51,.88)';
    ctx.fillRect(bx,by,tw,18);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(txt, bx+6, by+9);
  }
}

/* ============ 数据：各阶段函数图像 ============ */
const PI=Math.PI;
const E=Math.E;

const SECTIONS = [
  { key:'chu', plots:[
    { title:'一次函数', formula:'y = kx + b', mode:'yfx', xmin:-5,xmax:5,ymin:-5,ymax:5,
      series:[
        {label:'y = x', color:PALETTE[0], fn:x=>x},
        {label:'y = 2x − 1', color:PALETTE[1], fn:x=>2*x-1},
        {label:'y = −x + 2', color:PALETTE[2], fn:x=>-x+2},
      ],
      desc:'斜率为 k、截距为 b 的直线。k>0 递增，k<0 递减。' },

    { title:'正比例函数', formula:'y = kx', mode:'yfx', xmin:-5,xmax:5,ymin:-5,ymax:5,
      series:[
        {label:'y = x', color:PALETTE[0], fn:x=>x},
        {label:'y = ½x', color:PALETTE[1], fn:x=>0.5*x},
        {label:'y = −2x', color:PALETTE[2], fn:x=>-2*x},
      ],
      desc:'特殊一次函数（b=0），图像过原点。' },

    { title:'反比例函数', formula:'y = k/x', mode:'yfx', xmin:-5,xmax:5,ymin:-5,ymax:5,
      series:[
        {label:'y = 2/x (k>0)', color:PALETTE[0], fn:x=> x!==0?2/x:NaN},
        {label:'y = −2/x (k<0)', color:PALETTE[1], fn:x=> x!==0?-2/x:NaN},
      ],
      desc:'双曲线，以坐标轴为渐近线。k>0 在一、三象限，k<0 在二、四象限。' },

    { title:'二次函数（抛物线）', formula:'y = ax² + bx + c', mode:'yfx', xmin:-4,xmax:4,ymin:-5,ymax:5,
      series:[
        {label:'y = x² − 2 (a>0)', color:PALETTE[0], fn:x=>x*x-2},
        {label:'y = −x² + 3 (a<0)', color:PALETTE[1], fn:x=>-x*x+3},
      ],
      desc:'a>0 开口向上有最小值；a<0 开口向下有最大值。' },
  ]},

  { key:'gao', plots:[
    { title:'指数函数', formula:'y = aˣ', mode:'yfx', xmin:-3,xmax:3,ymin:-1,ymax:9,
      series:[
        {label:'y = 2ˣ', color:PALETTE[0], fn:x=>Math.pow(2,x)},
        {label:'y = eˣ', color:PALETTE[1], fn:x=>Math.exp(x)},
        {label:'y = (½)ˣ', color:PALETTE[2], fn:x=>Math.pow(0.5,x)},
      ],
      desc:'a>1 单调增且过(0,1)；0<a<1 单调减。增长型 vs 衰减型。' },

    { title:'对数函数', formula:'y = logₐx', mode:'yfx', xmin:0.1,xmax:6,ymin:-3,ymax:3,
      series:[
        {label:'y = ln x', color:PALETTE[0], fn:x=>Math.log(x)},
        {label:'y = log₂x', color:PALETTE[1], fn:x=>Math.log2(x)},
        {label:'y = log_{½}x', color:PALETTE[2], fn:x=>Math.log(x)/Math.log(0.5)},
      ],
      desc:'指数函数反函数，定义域 x>0，过(1,0)。' },

    { title:'幂函数', formula:'y = xᵃ', mode:'yfx', xmin:-3,xmax:3,ymin:-4,ymax:4,
      series:[
        {label:'y = x³', color:PALETTE[0], fn:x=>Math.pow(x,3)},
        {label:'y = x²', color:PALETTE[1], fn:x=>x*x},
        {label:'y = √x', color:PALETTE[3], fn:x=> x>=0?Math.sqrt(x):NaN},
        {label:'y = 1/x', color:PALETTE[4], fn:x=> x!==0?1/x:NaN},
      ],
      desc:'指数 a 决定形状：奇次幂过原点且奇对称；偶次幂偶对称。' },

    { title:'正弦函数', formula:'y = sin x', mode:'yfx', xmin:-2*PI,xmax:2*PI,ymin:-1.6,ymax:1.6,
      series:[ {label:'y = sin x', color:PALETTE[0], fn:x=>Math.sin(x)} ],
      desc:'周期 2π、奇函数，值域 [−1,1]。' },

    { title:'余弦函数', formula:'y = cos x', mode:'yfx', xmin:-2*PI,xmax:2*PI,ymin:-1.6,ymax:1.6,
      series:[ {label:'y = cos x', color:PALETTE[1], fn:x=>Math.cos(x)} ],
      desc:'周期 2π、偶函数，相位比正弦左移 π/2。' },

    { title:'正切函数', formula:'y = tan x', mode:'yfx', xmin:-2*PI,xmax:2*PI,ymin:-4,ymax:4,
      series:[ {label:'y = tan x', color:PALETTE[2], fn:x=>Math.tan(x)} ],
      desc:'周期 π，在 x=π/2+kπ 处有竖直渐近线，奇函数。' },

    { title:'反三角函数', formula:'arcsin / arccos / arctan', mode:'yfx', xmin:-4,xmax:4,ymin:-2.2,ymax:3.4,
      series:[
        {label:'y = arcsin x', color:PALETTE[0], fn:x=> x>=-1&&x<=1?Math.asin(x):NaN},
        {label:'y = arccos x', color:PALETTE[1], fn:x=> x>=-1&&x<=1?Math.acos(x):NaN},
        {label:'y = arctan x', color:PALETTE[2], fn:x=>Math.atan(x)},
      ],
      desc:'三角反函数，定义域/值域受限以保证单调（多值变单值）。' },
  ]},

  { key:'da', plots:[
    { title:'双曲函数', formula:'sinh / cosh / tanh', mode:'yfx', xmin:-3,xmax:3,ymin:-5,ymax:5,
      series:[
        {label:'y = sinh x', color:PALETTE[0], fn:x=>(Math.exp(x)-Math.exp(-x))/2},
        {label:'y = cosh x', color:PALETTE[1], fn:x=>(Math.exp(x)+Math.exp(-x))/2},
        {label:'y = tanh x', color:PALETTE[2], fn:x=>Math.tanh(x)},
      ],
      desc:'cosh x 为悬链线，恒≥1；tanh x 有界于 (−1,1)。满足 cosh²−sinh²=1。' },

    { title:'绝对值与分段函数', formula:'y = |x| 及分段', mode:'yfx', xmin:-4,xmax:4,ymin:-3,ymax:5,
      series:[
        {label:'y = |x|', color:PALETTE[0], fn:x=>Math.abs(x)},
        {label:'分段: x+2 (x<0), −x (x≥0)', color:PALETTE[1], fn:x=> x<0 ? x+2 : -x},
      ],
      desc:'绝对值产生“尖点”（不可导点）；分段函数在不同区间用不同表达式。' },

    { title:'高斯函数（正态钟形）', formula:'y = e^(−x²)', mode:'yfx', xmin:-4,xmax:4,ymin:-0.2,ymax:1.2,
      series:[ {label:'y = e^(−x²)', color:PALETTE[3], fn:x=>Math.exp(-x*x)} ],
      desc:'偶函数、钟形、在 x=0 取峰值 1，是概率论正态分布的核心。' },

    { title:'参数方程：圆与椭圆', formula:'(x,y) = (a cos t, b sin t)', mode:'parametric', xmin:-3,xmax:3,ymin:-2.2,ymax:2.2, square:true, xc:0,
      series:[
        {label:'圆 r=1', color:PALETTE[0], tmin:0,tmax:2*PI, xf:t=>Math.cos(t), yf:t=>Math.sin(t)},
        {label:'椭圆 a=2,b=1', color:PALETTE[1], tmin:0,tmax:2*PI, xf:t=>2*Math.cos(t), yf:t=>Math.sin(t)},
      ],
      desc:'用参数 t 描述曲线，便于处理非函数型（多值）图形。' },

    { title:'极坐标：心形线与玫瑰线', formula:'r = f(θ)', mode:'polar', xmin:-2.4,xmax:2.4,ymin:-2.4,ymax:2.4, square:true, xc:0,
      series:[
        {label:'心形线 r=1−cosθ', color:PALETTE[2], tmin:0,tmax:2*PI, rf:t=>1-Math.cos(t)},
        {label:'玫瑰线 r=cos(2θ)', color:PALETTE[1], tmin:0,tmax:2*PI, rf:t=>Math.cos(2*t)},
      ],
      desc:'极坐标下 r 随 θ 变化；玫瑰线 r=cos(kθ) 有 2k（k偶）或 k（k奇）个花瓣。' },

    { title:'极坐标：螺线', formula:'r = aθ / r = e^{bθ}', mode:'polar', xmin:-4.2,xmax:4.2,ymin:-4.2,ymax:4.2, square:true, xc:0,
      series:[
        {label:'阿基米德螺线 r=θ', color:PALETTE[0], tmin:0,tmax:6*PI, rf:t=>t/ (2*PI) },
        {label:'对数螺线 r=e^{0.15θ}', color:PALETTE[3], tmin:0,tmax:6*PI, rf:t=>Math.exp(0.15*t)/6},
      ],
      desc:'阿基米德螺线等间距展开；对数螺线 r=e^{bθ} 间距按比增长。' },

    { title:'摆线', formula:'x=a(t−sin t), y=a(1−cos t)', mode:'parametric', xmin:-0.2,xmax:6.6,ymin:-0.3,ymax:2.4,
      series:[ {label:'摆线 (a=1, 一拱)', color:PALETTE[4], tmin:0,tmax:2*PI, xf:t=>t-Math.sin(t), yf:t=>1-Math.cos(t)} ],
      desc:'圆沿直线滚动时圆上一点轨迹，一个拱对应滚动一周（本图展示一拱）。' },
  ]},

  { key:'kao', plots:[
    { title:'标准正态分布', formula:'φ(x) = 1/√(2π)·e^(−x²/2)', mode:'yfx', xmin:-4,xmax:4,ymin:-0.05,ymax:0.45,
      series:[
        {label:'φ(x) 概率密度', color:PALETTE[0], fn:x=>Math.exp(-x*x/2)/Math.sqrt(2*PI)},
        {label:'μ±σ 边界 x=±1', color:PALETTE[1], dash:[5,4], width:1.4, vline:-1},
        {label:'μ±σ 边界 x=±1', color:PALETTE[1], dash:[5,4], width:1.4, vline:1, legend:false},
      ],
      desc:'考研概率论核心。约 68% 落在 [−1,1]，95% 在 [−2,2]，99.7% 在 [−3,3]。' },

    { title:'等价无穷小对比', formula:'x→0: sinx, tanx, ln(1+x), eˣ−1 ~ x', mode:'yfx', xmin:-2,xmax:2,ymin:-2,ymax:2,
      series:[
        {label:'y = x', color:PALETTE[0], width:2.6, fn:x=>x},
        {label:'y = sin x', color:PALETTE[1], fn:x=>Math.sin(x)},
        {label:'y = tan x', color:PALETTE[2], fn:x=>Math.tan(x)},
        {label:'y = ln(1+x)', color:PALETTE[3], fn:x=> x>-1?Math.log(1+x):NaN},
        {label:'y = eˣ − 1', color:PALETTE[4], fn:x=>Math.exp(x)-1},
      ],
      desc:'x→0 时多条曲线贴着 y=x，这正是求极限时“等价替换”的依据。' },

    { title:'重要极限 Ⅰ', formula:'lim (1 + 1/x)ˣ = e', mode:'yfx', xmin:-20,xmax:20,ymin:0,ymax:3.4,
      series:[
        {label:'f(x) = (1+1/x)ˣ', color:PALETTE[0], fn:x=> x!==0&&x!==-1 ? Math.pow(1+1/x, x) : NaN},
        {label:'y = e ≈ 2.718', color:PALETTE[1], dash:[5,4], width:1.6, fn:x=>E},
      ],
      desc:'x→+∞ 与 x→−∞ 都趋于自然常数 e。' },

    { title:'泰勒多项式逼近 sin x', formula:'sin x ≈ x − x³/3! + x⁵/5!', mode:'yfx', xmin:-3,xmax:3,ymin:-2,ymax:2,
      series:[
        {label:'y = sin x', color:PALETTE[0], width:2.6, fn:x=>Math.sin(x)},
        {label:'P₁ = x', color:PALETTE[1], fn:x=>x},
        {label:'P₃ = x − x³/6', color:PALETTE[2], fn:x=>x-x*x*x/6},
        {label:'P₅ = x − x³/6 + x⁵/120', color:PALETTE[3], fn:x=>x-x*x*x/6+x*x*x*x*x/120},
      ],
      desc:'阶数越高，逼近区间越大——考研中常用泰勒展开求极限与证明。' },

    { title:'渐近线与拐点示例', formula:'f(x) = (x²−1)/(x−2)', mode:'yfx', xmin:-7,xmax:9,ymin:-14,ymax:14,
      series:[
        {label:'f(x) = (x²−1)/(x−2)', color:PALETTE[0], fn:x=> x!==2 ? (x*x-1)/(x-2) : NaN},
        {label:'斜渐近线 y = x + 2', color:PALETTE[1], dash:[5,4], width:1.6, fn:x=>x+2},
        {label:'竖直渐近线 x = 2', color:PALETTE[2], dash:[4,4], width:1.6, vline:2},
      ],
      desc:'x=2 处竖直渐近线，x→∞ 时趋近斜渐近线 y=x+2。' },
  ]},
];

/* ============ 构建页面 ============ */
const grids = {};
document.querySelectorAll('[data-grid]').forEach(g=> grids[g.dataset.grid]=g);

SECTIONS.forEach(sec=>{
  const grid = grids[sec.key];
  sec.plots.forEach(p=>{
    const card=document.createElement('div'); card.className='card';
    const h3=document.createElement('h3'); h3.textContent=p.title; card.appendChild(h3);
    const fm=document.createElement('p'); fm.className='formula'; fm.textContent=p.formula; card.appendChild(fm);
    const wrap=document.createElement('div'); wrap.className='canvas-wrap';
    const cv=document.createElement('canvas'); wrap.appendChild(cv); card.appendChild(wrap);
    // legend
    const lg=document.createElement('div'); lg.className='legend';
    p.series.forEach(s=>{
      if(s.legend===false) return;
      if(s.fn==null && s.vline==null && s.hline==null) return;
      const it=document.createElement('span'); it.className='item';
      const sw=document.createElement('span'); sw.className='swatch';
      sw.style.background=s.color||'#000'; if(s.dash) sw.style.background='transparent';
      const tx=document.createElement('span'); tx.textContent=s.label;
      it.appendChild(sw); it.appendChild(tx); lg.appendChild(it);
    });
    card.appendChild(lg);
    const ds=document.createElement('p'); ds.className='desc'; ds.textContent=p.desc; card.appendChild(ds);
    grid.appendChild(card);

    const spec = Object.assign({}, p, {canvas:cv});
    const draw = (hover)=> render(spec, hover);
    cv._draw = draw;
    requestAnimationFrame(()=> draw(null));
    // hover interaction
    wrap.addEventListener('mousemove', (e)=>{
      if(spec.mode==='polar'||spec.mode==='parametric'){
        // compute data coords from pixel
        const r=wrap.getBoundingClientRect();
        const W=r.width,H=r.height;
        // need current ranges; recompute quickly
        let xmin=spec.xmin,xmax=spec.xmax,ymin=spec.ymin,ymax=spec.ymax;
        if(spec.square){ const yr=ymax-ymin,xc=spec.xc!=null?spec.xc:0; const xr=yr*(W/H); xmin=xc-xr/2; xmax=xc+xr/2; }
        const px=e.clientX-r.left, py=e.clientY-r.top;
        const dx=xmax-xmin, dy=ymax-ymin;
        const x=xmin+px/W*dx, y=ymin+(H-py)/H*dy;
        draw({x,y});
      } else {
        const r=wrap.getBoundingClientRect();
        const W=r.width,H=r.height;
        let xmin=spec.xmin,xmax=spec.xmax;
        if(spec.square){ const yr=spec.ymax-spec.ymin,xc=spec.xc!=null?spec.xc:0; const xr=yr*(W/H); xmin=xc-xr/2; xmax=xc+xr/2; }
        const x=xmin+(e.clientX-r.left)/W*(xmax-xmin);
        const y=spec.ymax-(e.clientY-r.top)/H*(spec.ymax-spec.ymin);
        draw({x,y});
      }
    });
    wrap.addEventListener('mouseleave', ()=> draw(null));
  });
});

// redraw on resize
let rt;
window.addEventListener('resize', ()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    document.querySelectorAll('[data-grid] .card canvas').forEach(cv=> cv._draw && cv._draw(null));
  },150);
});
</script>
