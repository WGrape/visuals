<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunicorn worker_class</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #21262d 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #c9d1d9;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; font-size: 28px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #58a6ff; font-size: 14px; margin-bottom: 40px; font-family: monospace; }
        
        /* 架构图 */
        .diagram { display: flex; flex-direction: column; align-items: center; gap: 0; }
        .row { display: flex; align-items: center; justify-content: center; gap: 25px; flex-wrap: wrap; }
        
        /* 箭头 */
        .arrow { display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
        .arrow-line { width: 3px; height: 30px; background: linear-gradient(to bottom, #58a6ff, #79c0ff); position: relative; }
        .arrow-line::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-top: 8px solid #79c0ff;
        }
        .arrow-label { font-size: 11px; color: #8b949e; margin-top: 5px; white-space: nowrap; }
        
        /* 组件盒子 */
        .box {
            background: linear-gradient(145deg, #21262d, #30363d);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
            border: 2px solid;
            transition: all 0.3s;
            min-width: 140px;
            position: relative;
        }
        .box:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .box-icon { font-size: 28px; margin-bottom: 6px; }
        .box-title { font-size: 13px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
        .box-desc { font-size: 10px; color: #8b949e; line-height: 1.4; }
        
        /* 各层颜色 */
        .cdn { border-color: #7ee787; background: linear-gradient(145deg, #1a2e1a, #21262d); }
        .firewall { border-color: #f97583; background: linear-gradient(145deg, #2e1a1a, #21262d); }
        .dns { border-color: #56d4dd; background: linear-gradient(145deg, #1a2a2e, #21262d); }
        .slb-l4 { border-color: #ffa657; background: linear-gradient(145deg, #2e2a1a, #21262d); }
        .slb-l7 { border-color: #d2a8ff; background: linear-gradient(145deg, #2a1a2e, #21262d); }
        .waf { border-color: #ff7b72; background: linear-gradient(145deg, #2e1a1a, #21262d); }
        .k8s { border-color: #79c0ff; background: linear-gradient(145deg, #1a2433, #21262d); }
        .db { border-color: #f778ba; background: linear-gradient(145deg, #2a1a2a, #21262d); }
        .cache { border-color: #ffa198; background: linear-gradient(145deg, #2e201a, #21262d); }
        .mq { border-color: #a5d6ff; background: linear-gradient(145deg, #1a2233, #21262d); }
        
        /* 集群大框 */
        .cluster {
            border: 2px dashed #30363d;
            border-radius: 16px;
            padding: 20px 30px;
            background: rgba(48, 54, 61, 0.3);
            position: relative;
        }
        .cluster::before {
            content: attr(data-label);
            position: absolute; top: -11px; left: 20px;
            background: #30363d; color: #8b949e;
            padding: 2px 12px; border-radius: 12px;
            font-size: 11px; border: 1px solid #484f58;
        }
        .cluster-inner {
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
        }
        
        /* 四层/七层详细说明 */
        .layer-detail {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 18px;
            margin-top: 8px;
        }
        .layer-detail-title {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .l4 .layer-detail-title { color: #ffa657; }
        .l7 .layer-detail-title { color: #d2a8ff; }
        .layer-detail ul { list-style: none; font-size: 10px; color: #8b949e; }
        .layer-detail li { padding: 2px 0; }
        .layer-detail li::before { content: '▸ '; color: #484f58; }
        
        /* 图例 */
        .legend {
            margin-top: 40px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
        }
        .legend h3 { color: #f0f6fc; margin-bottom: 20px; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; }
        .legend-item { display: flex; gap: 12px; font-size: 12px; padding: 8px 12px; background: #21262d; border-radius: 6px; }
        .legend-num { color: #58a6ff; font-weight: 600; min-width: 20px; }
        
        /* 分层标题 */
        .layer-title {
            font-size: 10px;
            color: #6e7681;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 5px 0;
            padding: 5px 15px;
            background: rgba(88, 166, 255, 0.1);
            border-radius: 10px;
        }
        
        /* 协议标签 */
        .tag {
            display: inline-block;
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 3px;
            margin: 2px;
            font-family: monospace;
        }
        .tag-tcp { background: #ffa65733; color: #ffa657; }
        .tag-udp { background: #7ee78733; color: #7ee787; }
        .tag-http { background: #d2a8ff33; color: #d2a8ff; }
        .tag-https { background: #79c0ff33; color: #79c0ff; }
        .tag-dns { background: #56d4dd33; color: #56d4dd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gunicorn worker_class</h2>
        <img width="1196" height="1957" alt="Image" src="https://github.com/user-attachments/assets/2c573dda-0268-4623-bca2-c39310c557b6" />
    </div>
</body>
</html>
