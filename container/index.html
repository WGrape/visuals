<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuals 学习容器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1323;
            --panel: rgba(13, 22, 42, 0.9);
            --border: rgba(255, 255, 255, 0.12);
            --text: #e5eefc;
            --muted: rgba(229, 238, 252, 0.72);
            --accent: #fb923c;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 15% 10%, #1f2c50 0%, var(--bg) 48%, #050912 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 1rem;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .left {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            min-width: 0;
        }

        .btn {
            border: 1px solid rgba(251, 146, 60, 0.35);
            background: rgba(251, 146, 60, 0.12);
            color: var(--text);
            padding: 0.48rem 0.9rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.92rem;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(251, 146, 60, 0.2);
        }

        .title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .frame-wrap {
            flex: 1;
            min-height: 0;
            padding: 0.8rem;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 86px);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }

        .empty {
            margin: auto;
            max-width: 720px;
            width: min(92vw, 720px);
            padding: 1.6rem;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            line-height: 1.7;
        }

        .empty h1 {
            font-size: 1.25rem;
            margin-bottom: 0.7rem;
        }

        .empty p {
            color: var(--muted);
            margin-bottom: 0.6rem;
        }

        @media (max-width: 768px) {
            .topbar {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .frame-wrap {
                padding: 0.6rem;
            }

            iframe {
                min-height: calc(100vh - 126px);
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="left">
            <a id="backBtn" class="btn" href="../index.html">← 返回</a>
            <div id="pageTitle" class="title">正在加载...</div>
        </div>
        <a class="btn" href="../index.html">Visuals 首页</a>
    </header>

    <main id="main" class="frame-wrap"></main>

    <script>
        (function () {
            const main = document.getElementById("main");
            const pageTitle = document.getElementById("pageTitle");
            const backBtn = document.getElementById("backBtn");
            const raw = new URLSearchParams(window.location.search).get("page");

            function renderError(message) {
                main.innerHTML = "";

                const box = document.createElement("section");
                box.className = "empty";
                box.innerHTML =
                    "<h1>无法打开页面</h1>" +
                    "<p>" + message + "</p>" +
                    "<p>请返回上一级重新选择学习卡片。</p>";

                pageTitle.textContent = "无效页面";
                main.appendChild(box);
            }

            function sanitizePageParam(input) {
                if (!input) return null;

                let decoded;
                try {
                    decoded = decodeURIComponent(input);
                } catch (error) {
                    return null;
                }

                decoded = decoded.trim().replace(/\\/g, "/");
                const protocolUnsafe = /^(?:https?:)?\/\//i.test(decoded);
                if (protocolUnsafe) return null;

                const cleaned = decoded.replace(/^\/+/, "");
                if (cleaned.includes("..")) return null;

                if (!/\.html(?:[?#].*)?$/i.test(cleaned)) return null;

                return cleaned;
            }

            const safePage = sanitizePageParam(raw);
            if (!safePage) {
                renderError("URL 参数 page 缺失或格式不合法。");
                return;
            }

            const purePath = safePage.split("?")[0].split("#")[0];
            const pathParts = purePath.split("/").filter(Boolean);
            const fileName = pathParts[pathParts.length - 1] || "学习页面";
            const sectionName = pathParts[0];

            if (sectionName) {
                backBtn.href = "../" + sectionName + "/index.html";
            }

            pageTitle.textContent = fileName.replace(/\.html$/i, "");
            pageTitle.textContent = sectionName + "/" + fileName
            pageTitle.textContent = purePath

            const frame = document.createElement("iframe");
            frame.src = "../" + safePage;
            frame.title = "Visuals 学习内容";
            frame.loading = "eager";
            frame.referrerPolicy = "same-origin";
            frame.setAttribute("allowfullscreen", "true");

            main.appendChild(frame);
        })();
    </script>
</body>
</html>
