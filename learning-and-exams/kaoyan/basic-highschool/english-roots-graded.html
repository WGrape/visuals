<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词根分级手册 · 初中 / 高中 / 四级 / 六级</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --card:#1c2333; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#3fb950;
  --jr:#4ade80; --sr:#60a5fa; --c4:#fbbf24; --c6:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
header{text-align:center;padding:28px 0 10px}
h1{font-size:30px;background:linear-gradient(120deg,#58a6ff,#4ade80,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.subtitle{color:var(--muted);font-size:15px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 22px;text-align:center;min-width:96px}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:26px;border-radius:0 0 12px 12px}
.search{width:100%;max-width:520px;display:block;margin:0 auto 12px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:13px;transition:.2s}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.controls{text-align:center;margin-bottom:26px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 18px;border-radius:8px;cursor:pointer;font-size:13px;margin:0 5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.stage{margin-bottom:44px}
.stage-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.stage-icon{font-size:26px}
.stage-title{font-size:22px;font-weight:700}
.stage-desc{color:var(--muted);font-size:13px;margin-bottom:18px;padding-left:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.root-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.2s}
.root-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.root-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.root-name{font-size:19px;font-weight:700;color:var(--accent);font-family:Georgia,serif;font-style:italic}
.root-mean{font-size:13px;color:var(--muted);text-align:right}
.root-origin{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic}
.words{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;display:none}
.root-card.open .words{display:block}
.word{padding:7px 0;border-bottom:1px solid rgba(48,54,61,.5)}
.word:last-child{border-bottom:none}
.word-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv{font-size:10px;padding:1px 8px;border-radius:10px;color:#0d1117;font-weight:700}
.lv-jr{background:var(--jr)} .lv-sr{background:var(--sr);color:#fff} .lv-c4{background:var(--c4)} .lv-c6{background:var(--c6)}
.w-spell{font-weight:700;font-size:15px}
.w-ph{color:var(--muted);font-size:12px;font-style:italic}
.w-pos{color:var(--c4);font-size:12px}
.w-mean{font-size:13.5px;margin:2px 0 0 0}
.w-tip{font-size:12px;color:#7ee787;margin-top:2px}
.affix-group{margin-bottom:20px}
.affix-title{font-size:16px;font-weight:700;margin-bottom:10px;color:var(--accent)}
.affix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.affix{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px}
.affix b{color:var(--accent2);font-family:Georgia,serif;font-style:italic;margin-right:6px}
.affix span{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--border);padding-top:20px}
@media(max-width:640px){h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>英语词根分级手册</h1>
<p class="subtitle">初中入门 → 高中核心 → 四级高频 → 六级进阶，一路打通词汇命脉，附常用前后缀速查</p>
</header>

<div class="stats">
<div class="stat"><b id="stRoots">0</b><span>常用词根</span></div>
<div class="stat"><b id="stWords">0</b><span>派生单词</span></div>
<div class="stat"><b>4</b><span>学习阶段</span></div>
<div class="stat"><b id="stAffix">0</b><span>前后缀</span></div>
</div>

<div class="toolbar">
<input class="search" id="search" type="text" placeholder="🔍 搜索词根、单词或释义，如：spect / predict / 预言">
<div class="tabs" id="tabs"></div>
</div>

<div class="controls">
<button class="btn" onclick="toggleAll(true)">全部展开</button>
<button class="btn" onclick="toggleAll(false)">全部收起</button>
</div>

<div id="content"></div>
<div class="empty" id="empty">没有找到匹配的内容，换个关键词试试～</div>

<footer>词汇学习建议：先记词根本义，再拆解派生词 · 反复回看胜过一次记牢</footer>
</div>

 {a:"super-",m:"超越；超级",ex:"supermarket 超市 / supernatural 超自然的"},
 {a:"inter-",m:"在…之间；相互",ex:"international 国际的 / interview 面试"},
 {a:"trans-",m:"横过；转变",ex:"transport 运输 / transform 转变"},
 {a:"ex-",m:"向外；前任",ex:"export 出口 / ex-president 前总统"},
 {a:"fore-",m:"预先；前面",ex:"forecast 预报 / forehead 前额"},
 {a:"anti-",m:"反对；防",ex:"antibody 抗体 / antifreeze 防冻剂"},
 {a:"de-",m:"去除；向下",ex:"deforest 砍伐森林 / descend 下降"},
 {a:"en- / em-",m:"使…；进入",ex:"enable 使能够 / encourage 鼓励"},
 {a:"com- / con- / col- / cor-",m:"共同；加强",ex:"connect 连接 / cooperate 合作 / correlate 相关"},
 {a:"ad- / ac- / af- / ag-",m:"朝向；加强",ex:"adapt 适应 / accept 接受 / affect 影响"},
 {a:"ob- / op-",m:"逆；对着",ex:"object 反对 / oppose 反抗"},
 {a:"per-",m:"贯穿；彻底",ex:"perfect 完美的 / persist 坚持"},
 {a:"pro-",m:"向前；支持",ex:"progress 进步 / pro-reform 支持改革"},
 {a:"auto-",m:"自己；自动",ex:"automatic 自动的 / autobiography 自传"},
 {a:"bi- / tri-",m:"双 / 三",ex:"bicycle 自行车 / triangle 三角形"},
 {a:"mono- / uni-",m:"单一",ex:"monologue 独白 / uniform 制服"},
 {a:"multi-",m:"多",ex:"multimedia 多媒体"},
 {a:"micro- / macro-",m:"微小 / 宏大",ex:"microscope 显微镜 / macroeconomic 宏观经济的"},
 {a:"tele-",m:"远",ex:"telephone 电话 / television 电视"}],
suffixes:[
 {a:"-er / -or",m:"人；物",ex:"teacher 教师 / actor 演员"},
 {a:"-ist",m:"专业人员；信徒",ex:"scientist 科学家 / tourist 游客"},
 {a:"-ness",m:"状态（名词）",ex:"happiness 幸福 / kindness 善良"},
 {a:"-ment",m:"行为结果（名词）",ex:"development 发展 / movement 运动"},
 {a:"-tion / -sion",m:"行为状态（名词）",ex:"action 行动 / decision 决定"},
 {a:"-ity / -ty",m:"性质（名词）",ex:"ability 能力 / safety 安全"},
 {a:"-ship",m:"关系身份（名词）",ex:"friendship 友谊 / membership 会员身份"},
 {a:"-hood",m:"时期身份（名词）",ex:"childhood 童年 / neighborhood 街区"},
 {a:"-ance / -ence",m:"性质状态（名词）",ex:"importance 重要 / difference 差异"},
 {a:"-ism",m:"主义；行为",ex:"realism 现实主义 / tourism 旅游业"},
 {a:"-ful",m:"充满…的",ex:"careful 仔细的 / useful 有用的"},
 {a:"-less",m:"没有…的",ex:"careless 粗心的 / homeless 无家可归的"},
 {a:"-able / -ible",m:"能够…的",ex:"comfortable 舒适的 / visible 可见的"},
 {a:"-ous / -ious",m:"充满…的",ex:"famous 著名的 / various 各种各样的"},
 {a:"-ive",m:"有…倾向的",ex:"active 活跃的 / creative 创造性的"},
 {a:"-al",m:"…的（形容词）",ex:"natural 自然的 / personal 个人的"},
 {a:"-ish",m:"略呈…的",ex:"reddish 略红的 / childish 幼稚的"},
 {a:"-y",m:"有…性质的",ex:"sunny 晴朗的 / tasty 美味的"},
 {a:"-ant / -ent",m:"…的；人",ex:"important 重要的 / student 学生"},
 {a:"-en",m:"由…制成；使变",ex:"wooden 木制的 / strengthen 加强"},
 {a:"-ly",m:"地（副词）；…的",ex:"quickly 迅速地 / friendly 友好的"},
 {a:"-ward",m:"方向",ex:"forward 向前 / backward 向后"},
 {a:"-wise",m:"方式；方向",ex:"likewise 同样地 / clockwise 顺时针"},
 {a:"-ify / -ize",m:"使…；…化",ex:"simplify 简化 / modernize 使现代化"},
 {a:"-ate",m:"使…（动词）",ex:"activate 激活 / motivate 激励"}]
};

// ---------- 统计 ----------
let rootCount=0, wordCount=0;
STAGES.forEach(s=>{ rootCount+=DATA[s.id].length; DATA[s.id].forEach(r=>wordCount+=r.words.length); });
document.getElementById("stRoots").textContent=rootCount;
document.getElementById("stWords").textContent=wordCount;
document.getElementById("stAffix").textContent=AFFIXES.prefixes.length+AFFIXES.suffixes.length;

// ---------- 渲染 ----------
const content=document.getElementById("content");
const tabsEl=document.getElementById("tabs");
let currentTab="all";
const kw=()=>document.getElementById("search").value.trim().toLowerCase();

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function matchRoot(r){
  const k=kw(); if(!k) return true;
  if(r.root.toLowerCase().includes(k)||r.mean.includes(kw())||r.origin.toLowerCase().includes(k)) return true;
  return r.words.some(wd=>wd.w.toLowerCase().includes(k)||wd.mean.includes(kw())||wd.tip.toLowerCase().includes(k));
}

function render(){
  const k=kw();
  let html="";
  STAGES.forEach(s=>{
    if(currentTab!=="all"&&currentTab!==s.id) return;
    const roots=DATA[s.id].filter(matchRoot);
    if(!roots.length&&k) return;
    html+='<section class="stage" data-stage="'+s.id+'">';
    html+='<div class="stage-head"><span class="stage-icon">'+s.icon+'</span><span class="stage-title" style="color:'+s.color+'">'+s.name+'</span><span style="color:var(--muted);font-size:13px">（'+roots.length+' 个词根）</span></div>';
    html+='<p class="stage-desc">'+s.desc+'</p><div class="grid">';
    roots.forEach((r,i)=>{
      const open=k||false;
      html+='<div class="root-card'+(open?" open":"")+'">';
      html+='<div class="root-head"><span class="root-name">'+esc(r.root)+'</span><span class="root-mean">'+esc(r.mean)+'</span></div>';
      html+='<div class="root-origin">词源：'+esc(r.origin)+'</div>';
      html+='<div class="words">';
      r.words.forEach(w=>{
        html+='<div class="word">';
        html+='<div class="word-top"><span class="lv '+s.lv+'">'+s.name+'</span><span class="w-spell">'+esc(w.w)+'</span><span class="w-ph">'+esc(w.ph)+'</span><span class="w-pos">'+esc(w.pos)+'</span></div>';
        html+='<p class="w-mean">'+esc(w.mean)+'</p>';
        html+='<p class="w-tip">💡 '+esc(w.tip)+'</p>';
        html+='</div>';
      });
      html+='</div></div>';
    });
    html+='</div></section>';
  });
  // 前后缀
  if(currentTab==="all"||currentTab==="affix"){
    let pAffix=AFFIXES.prefixes, sAffix=AFFIXES.suffixes;
    if(k){
      pAffix=pAffix.filter(a=>(a.a+a.m+a.ex).toLowerCase().includes(k));
      sAffix=sAffix.filter(a=>(a.a+a.m+a.ex).toLowerCase().includes(k));
    }
    if(pAffix.length||sAffix.length){
      html+='<section class="stage" data-stage="affix">';
      html+='<div class="stage-head"><span class="stage-icon">🔧</span><span class="stage-title" style="color:var(--accent2)">常用前后缀速查</span><span style="color:var(--muted);font-size:13px">（'+(pAffix.length+sAffix.length)+' 条）</span></div>';
      html+='<p class="stage-desc" style="padding-left:38px">前缀改变词义方向，后缀改变词性 —— 与词根配合，可成倍扩展词汇量。</p>';
      if(pAffix.length){
        html+='<div class="affix-group"><div class="affix-title">前缀 Prefixes（'+pAffix.length+'）</div><div class="affix-grid">';
        pAffix.forEach(a=>{html+='<div class="affix"><b>'+esc(a.a)+'</b>'+esc(a.m)+'<br><span>'+esc(a.ex)+'</span></div>'});
        html+='</div></div>';
      }
      if(sAffix.length){
        html+='<div class="affix-group"><div class="affix-title">后缀 Suffixes（'+sAffix.length+'）</div><div class="affix-grid">';
        sAffix.forEach(a=>{html+='<div class="affix"><b>'+esc(a.a)+'</b>'+esc(a.m)+'<br><span>'+esc(a.ex)+'</span></div>'});
        html+='</div></div>';
      }
      html+='</section>';
    }
  }
  content.innerHTML=html;
  document.getElementById("empty").style.display=html?"none":"block";
  bindCards();
}

function bindCards(){
  document.querySelectorAll(".root-card").forEach(c=>{
    c.onclick=e=>{ c.classList.toggle("open"); e.stopPropagation(); };
  });
}

function toggleAll(open){
  document.querySelectorAll(".root-card").forEach(c=>c.classList.toggle("open",open));
}

// tabs
const TABS=[{id:"all",name:"全部"},{id:"affix",name:"前后缀"}].concat(STAGES.map(s=>({id:s.id,name:s.icon+" "+s.name})));
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.className="tab"+(t.id==="all"?" active":"");
  b.textContent=t.name;
  b.onclick=()=>{ currentTab=t.id; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active"); render(); };
  tabsEl.appendChild(b);
});

document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
